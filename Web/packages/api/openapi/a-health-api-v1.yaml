openapi: 3.1.0

info:
  title: A-health Platform API
  version: 1.0.0-phase1
  summary: Contract for Phase 0 (Identity) and Phase 1 (Core Consultation).
  description: |
    Authoritative contract for the A-health platform. Frontend and backend build
    against this document in parallel; it is the single source of truth for
    request/response shapes.

    ## Conventions

    - REST over HTTPS. JSON only. Base path `/api/v1`.
    - Field naming: `snake_case` everywhere, no exceptions.
    - All timestamps are RFC 3339 / ISO 8601 in UTC with a `Z` suffix.
    - All identifiers are UUID v4 strings.
    - Every mutable resource carries `version` (integer) and `updated_at`.
      Clients send `base_version` when writing to detect conflicts.

    ## Authentication

    Bearer JWT. Access token TTL 15 minutes, refresh token TTL 30 days and
    rotated on every use. RBAC is enforced at the gateway AND re-validated in
    the service layer — never rely on the client hiding a control.

    ## State transitions

    Clinical state changes are expressed as action sub-resources
    (`POST /consultations/{id}/accept`), never as a `PATCH` on a status field.
    This pattern is applied uniformly across every resource so there is one rule
    to remember. Each action has its own permission check, its own audit entry,
    and its own set of legal source states.

    ## Idempotency

    Every POST that creates or transitions clinical state requires an
    `Idempotency-Key` header. The key is generated on the client, before the
    first send attempt, and reused across retries. The server stores the first
    response against the key for 24 hours and replays it on repeat. Without
    this, offline sync produces duplicate clinical records.

    ## Pagination

    Two modes, chosen by volatility:

    - Cursor (`cursor` + `limit`) for lists that change while being read —
      the clinician queue, message threads, sync changes.
    - Page (`page` + `page_size`) for stable lists — dependants, own history.

    ## Realtime

    WebSocket at `wss://{host}/api/v1/realtime`, authenticated with a
    short-lived ticket from `POST /realtime/token` (the browser WebSocket API
    cannot set an Authorization header). Server-pushed events:
    `consultation.assigned`, `consultation.escalated`, `consultation.message`,
    `consultation.completed`, `checkin.deviation`. Every event carries
    `entity`, `id`, `version` so the client can reconcile against local state.

    ## Care threads

    The unit of the system is the care thread, not the visit. A thread opens on
    the patient's first request for a given problem and stays open until
    recovery criteria are met. Consultations, notes, prescriptions, follow-up
    cycles and check-ins all attach to a thread. A deviation detected weeks
    after discharge reopens consultation *within the same thread*, so the
    receiving clinician sees the whole history rather than an isolated case.

    ## Two ways in

    A consultation is reached by one of two routes, and both converge on the
    same `ConsultationRequest`:

    - **On demand.** `POST /consultations` — the request enters triage, gets an
      SLA deadline, and is routed to whichever verified clinician ranks highest.
      This is the path for someone who is unwell now.
    - **Scheduled.** `POST /appointments` against a slot the clinician has
      published, then `POST /appointments/{id}/start` at the appointed time,
      which opens the consultation with the clinician already assigned. This is
      the path for chronic review, antenatal care, and anything a patient plans.

    Everything downstream — queue, consultation, note, prescription, follow-up —
    is identical regardless of route.

    ## Messaging is thread-scoped, not consultation-scoped

    Messages attach to the care thread. A consultation closing does not end the
    conversation: the promise is follow-up until recovery, so a patient must be
    able to message the clinician on day nine after a day-one discharge without
    opening a new case. `consultation_id` on a message is an optional link
    recording which consultation was open at the time, if any.

  contact:
    name: A-health Engineering
    email: architecture@a-health.org
  license:
    identifier: LicenseRef-A-health-Proprietary
    name: Proprietary — internal use only

servers:
  - url: https://api.a-health.org/api/v1
    description: Production
  - url: https://staging-api.a-health.org/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: auth
    description: Registration, OTP, login, token lifecycle. Phase 0.
  - name: users
    description: Own profile and dependants. Phase 0.
  - name: audit
    description: Authorized internal audit ledger and patient-owned transparency views.
  - name: clinicians
    description: Verification, availability, load. Phase 0.
  - name: care-threads
    description: The continuing unit of care. Phase 1.
  - name: appointments
    description: Scheduled bookings against a clinician's published slots. Phase 1.
  - name: consultations
    description: Consultation request lifecycle. Phase 1.
  - name: queue
    description: Clinician live queue and patient-facing queue position. Phase 1.
  - name: messages
    description: Patient/clinician conversation, thread-scoped. Phase 1.
  - name: gateway
    description: USSD and SMS aggregator webhooks. Internal. Phase 2.
  - name: follow-up
    description: Follow-up cycles, check-ins, deviation detection. Phase 3.
  - name: medications
    description: Prescriptions, dose schedule, adherence confirmation. Phase 3.
  - name: ai
    description: Assistant, triage support, transcription. Advisory only. Phase 5.
  - name: emergency
    description: Emergency requests, transport dispatch, live tracking. Phase 4.
  - name: devices
    description: Wearables and vehicle sensors. Phase 6.
  - name: prevention
    description: Risk scoring, screening, vaccination. Phase 5.
  - name: pharmacy
    description: Pharmacy directory, availability search, dispensing handoff. Phase 4.
  - name: diagnostics
    description: Laboratory, imaging and pathology orders and results. Phase 4.
  - name: network
    description: Professional communities, case discussion, second opinions. Phase 5.
  - name: education
    description: Multilingual health education content. Phase 3.
  - name: families
    description: Family groups and assigned family doctors. Phase 5.
  - name: research
    description: De-identified datasets for approved studies. Phase 6.
  - name: surveillance
    description: Aggregated disease trends by geography. Phase 6.
  - name: payment
    description: Payment intents for consultations and pharmacy purchases — mobile money, card, cash. Phase 4.
  - name: insurance
    description: Coverage checks and claims. Phase 6.
  - name: quality
    description: Ratings and incident reporting. Phase 5.
  - name: facilities
    description: Facility directory, departments, live queue. Phase 4.
  - name: sync
    description: Offline reconciliation. Cross-cutting.
  - name: system
    description: Health checks and realtime tickets.

security:
  - bearerAuth: []

paths:

  # ----------------------------------------------------------------------
  # Phase 0 — Identity & Access
  # ----------------------------------------------------------------------

  /auth/register/patient:
    post:
      tags: [auth]
      summary: Register a patient and trigger an OTP
      description: |
        Phone number is the primary identifier. No password is set for patient
        accounts — authentication is OTP only. Returns 202 because the account
        is not usable until the OTP is verified.

        Registering an already-registered number returns 202 as well, with an
        OTP sent, so the endpoint cannot be used to enumerate which numbers
        exist on the platform.
      operationId: registerPatient
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, preferred_language]
              properties:
                phone_number:
                  $ref: '#/components/schemas/PhoneNumber'
                full_name:
                  type: string
                  maxLength: 150
                preferred_language:
                  $ref: '#/components/schemas/LanguageCode'
                channel:
                  $ref: '#/components/schemas/Channel'
      responses:
        '202':
          description: OTP dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/register/clinician:
    post:
      tags: [auth]
      summary: Register a clinician pending verification
      description: |
        Creates an account with `status = pending_verification`. The clinician
        cannot accept consultations, and no consultation note can be signed by
        them, until an admin approves the licence via
        `POST /clinicians/{clinician_id}/verification`.

        `verification_document_keys` are object-storage keys obtained from a
        prior upload; raw files are never posted to this endpoint.
      operationId: registerClinician
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [phone_number, full_name, email, license_number, specialty, preferred_language]
              properties:
                phone_number:
                  $ref: '#/components/schemas/PhoneNumber'
                full_name:
                  type: string
                  maxLength: 150
                email:
                  type: string
                  format: email
                license_number:
                  type: string
                  maxLength: 50
                specialty:
                  $ref: '#/components/schemas/Specialty'
                languages_spoken:
                  type: array
                  items:
                    $ref: '#/components/schemas/LanguageCode'
                preferred_language:
                  $ref: '#/components/schemas/LanguageCode'
                facility_id:
                  type: string
                  format: uuid
                  description: Optional. Reference only — does not grant facility privileges.
                verification_document_keys:
                  type: array
                  items: { type: string }
      responses:
        '202':
          description: Registered, verification pending, OTP dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/otp/request:
    post:
      tags: [auth]
      summary: Request an OTP for an existing account
      description: |
        Rate limited per phone number and per source IP. Always returns 202
        whether or not the number is registered, to prevent enumeration.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number]
              properties:
                phone_number:
                  $ref: '#/components/schemas/PhoneNumber'
                channel:
                  $ref: '#/components/schemas/Channel'
      responses:
        '202':
          description: OTP dispatched if the account exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify an OTP and issue tokens
      description: |
        Six digits, five-minute expiry, maximum five attempts per challenge.
        Exceeding the attempt limit invalidates the challenge entirely — a new
        one must be requested.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id:
                  type: string
                  format: uuid
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                device_id:
                  type: string
                  description: Stable client-generated device identifier, for session management.
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [auth]
      summary: Password login for clinician and admin roles
      description: |
        Patients never use this endpoint. If the account has MFA enabled the
        response is an MFA challenge rather than a token pair.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                device_id:
                  type: string
      responses:
        '200':
          description: Authenticated, or MFA challenge issued
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - $ref: '#/components/schemas/OtpChallenge'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/token/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and issue a new access token
      description: |
        The presented refresh token is invalidated on use. If an already-used
        refresh token is presented, the entire token family is revoked — this
        is the standard reuse-detection response to a stolen token.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      operationId: logout
      responses:
        '204':
          description: Session revoked
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /audit/ledger:
    get:
      tags: [audit]
      summary: List supported identity, consent and emergency audit events
      description: Platform administrator only. Sensitive operational fields and hashes are never returned.
      operationId: listAuditLedgerEvents
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [consent, verification, break_glass]
        - name: cursor
          in: query
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Safe page of supported events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditLedgerPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit/verify:
    post:
      tags: [audit]
      summary: Verify the complete internal audit hash chain
      description: Platform administrator only. Returns status and counts without event metadata or hashes.
      operationId: verifyAuditLedger
      responses:
        '200':
          description: Complete chain verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLedgerVerification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/me:
    get:
      tags: [users]
      summary: Get the authenticated user's profile
      operationId: getMe
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [users]
      summary: Update own profile
      description: |
        Non-clinical fields only. Clinical history is never edited through this
        endpoint — it is written by clinicians through consultation notes.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version]
              properties:
                base_version:
                  type: integer
                full_name:
                  type: string
                  maxLength: 150
                preferred_language:
                  $ref: '#/components/schemas/LanguageCode'
                default_location:
                  $ref: '#/components/schemas/GeoPoint'
                region_code:
                  type: string
                  maxLength: 20
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /users/me/dependents:
    get:
      tags: [users]
      summary: List dependant profiles under this guardian
      operationId: listDependents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Dependants
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientProfile'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      tags: [users]
      summary: Add a dependant under this guardian
      description: |
        A dependant profile has no login of its own. Consultations raised for a
        dependant are always attributed to the guardian's authenticated session
        plus the dependant's `patient_profile_id`.
      operationId: createDependent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, date_of_birth, sex]
              properties:
                full_name:
                  type: string
                  maxLength: 150
                date_of_birth:
                  type: string
                  format: date
                sex:
                  $ref: '#/components/schemas/Sex'
                chronic_conditions:
                  type: array
                  items: { type: string }
                allergies:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Dependant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /clinicians/me:
    get:
      tags: [clinicians]
      summary: Get the authenticated clinician's own profile
      description: Clinician only. Resolves the profile from the authenticated token; it does not accept a caller-supplied clinician ID.
      operationId: getMyClinicianProfile
      responses:
        '200':
          description: Own clinician profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClinicianProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /clinicians:
    get:
      tags: [clinicians]
      summary: Clinician directory or Admin verification list
      description: |
        Authenticated non-admin callers receive active, verified clinician
        directory entries. A platform_admin may filter pending and other
        verification states; only that role receives license and verification
        details needed for the existing Admin workflow. Cursor paginated.
      operationId: listClinicians
      parameters:
        - name: verification_status
          in: query
          schema: { $ref: '#/components/schemas/VerificationStatus' }
        - name: specialty
          in: query
          schema: { $ref: '#/components/schemas/Specialty' }
        - name: is_available
          in: query
          schema: { type: boolean }
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Clinicians
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClinicianDirectoryEntry' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /clinicians/{clinician_id}:
    get:
      tags: [clinicians]
      summary: Get one clinician profile
      description: |
        Readable by an admin, or by the clinician themselves. Anyone else gets
        403 rather than 404, because the id is not a secret — what is protected
        is the record, not its existence.
      operationId: getClinician
      parameters:
        - $ref: '#/components/parameters/ClinicianId'
      responses:
        '200':
          description: Clinician profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClinicianProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /clinicians/{clinician_id}/verification:
    post:
      tags: [clinicians]
      summary: Approve or reject a clinician's licence verification
      description: |
        Admin only. Approval is what makes a clinician eligible for routing and
        for signing consultation notes. Rejection requires a reason, which is
        returned to the clinician.
      operationId: decideClinicianVerification
      parameters:
        - $ref: '#/components/parameters/ClinicianId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  description: Required when decision is `reject`.
      responses:
        '200':
          description: Verification recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicianProfile'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /clinicians/me/availability:
    put:
      tags: [clinicians]
      summary: Set own on-duty availability
      description: |
        Going off duty does not drop consultations already assigned — those must
        be completed or explicitly reassigned. It only removes the clinician
        from the routing candidate pool.
      operationId: setAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_available]
              properties:
                is_available: { type: boolean }
                until:
                  type: string
                  format: date-time
                  description: Optional auto-expiry for the availability state.
      responses:
        '200':
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicianProfile'
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # Phase 1 — Care threads and consultations
  # ----------------------------------------------------------------------

  /care-threads:
    get:
      tags: [care-threads]
      summary: List care threads visible to the caller
      description: |
        A patient sees their own threads and those of their dependants. A
        clinician sees threads where they are the primary clinician or have an
        assigned consultation. Admins require a logged access reason.
      operationId: listCareThreads
      parameters:
        - name: patient_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CareThreadStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Care threads
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CareThread'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '403': { $ref: '#/components/responses/Forbidden' }

  /care-threads/{care_thread_id}:
    get:
      tags: [care-threads]
      summary: Get one care thread with its full timeline
      description: |
        Returns the thread plus an ordered timeline of every consultation,
        note, prescription and check-in attached to it. This is the view a
        clinician opens when a patient reappears months later.
      operationId: getCareThread
      parameters:
        - $ref: '#/components/parameters/CareThreadId'
      responses:
        '200':
          description: Care thread with timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareThreadDetail'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /care-threads/{care_thread_id}/close:
    post:
      tags: [care-threads]
      summary: Close a care thread
      description: |
        Clinician only, and only when no consultation on the thread is still
        open. Closing is reversible only by opening a new consultation, which
        reopens the thread automatically.
      operationId: closeCareThread
      parameters:
        - $ref: '#/components/parameters/CareThreadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [recovered, referred_out, lost_to_follow_up, deceased]
                notes: { type: string }
      responses:
        '200':
          description: Thread closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareThread'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /care-threads/{care_thread_id}/messages:
    get:
      tags: [messages]
      summary: List messages on a care thread
      description: |
        Cursor paginated, oldest first. Filter by `consultation_id` to show only
        the exchange that happened during one consultation; omit it to show the
        whole conversation including messages sent between consultations.
      operationId: listMessages
      parameters:
        - $ref: '#/components/parameters/CareThreadId'
        - name: consultation_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [messages]
      summary: Post a message to the care thread
      description: |
        Text, or a reference to an uploaded voice note or image. The server
        attaches `consultation_id` automatically when a consultation is open.

        Delivery goes over the realtime channel to app users and is fanned out
        over SMS by the notification service for feature-phone users — the
        sender does not choose the transport.

        Permitted while the thread is open, whether or not a consultation is in
        progress. Once the thread is closed, returns 409 `CARE_THREAD_CLOSED`;
        the patient must raise a new consultation.
      operationId: createMessage
      parameters:
        - $ref: '#/components/parameters/CareThreadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  maxLength: 4000
                attachment_key: { type: string }
                attachment_type:
                  type: string
                  enum: [voice_note, image, document]
                client_created_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Message posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /clinicians/{clinician_id}/slots:
    get:
      tags: [appointments]
      summary: List a clinician's bookable slots
      description: |
        Returns published, unbooked slots within the requested window. Slots are
        the clinician's own availability, not a hospital's room schedule — no
        facility integration is required to use this.
      operationId: listClinicianSlots
      parameters:
        - $ref: '#/components/parameters/ClinicianId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Available slots
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Slot'
        '404': { $ref: '#/components/responses/NotFound' }

  /clinicians/me/slots:
    put:
      tags: [appointments]
      summary: Publish own bookable slots for a period
      description: |
        Replaces the clinician's published slots inside the given window.
        Already-booked slots are preserved and returned in `retained`; removing
        one requires cancelling its appointment first.
      operationId: publishSlots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, slots]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                slots:
                  type: array
                  items:
                    type: object
                    required: [starts_at, duration_minutes]
                    properties:
                      starts_at: { type: string, format: date-time }
                      duration_minutes: { type: integer, minimum: 5, maximum: 120 }
                      modality:
                        $ref: '#/components/schemas/ConsultationModality'
      responses:
        '200':
          description: Slots published
          content:
            application/json:
              schema:
                type: object
                properties:
                  published:
                    type: array
                    items:
                      $ref: '#/components/schemas/Slot'
                  retained:
                    type: array
                    items:
                      $ref: '#/components/schemas/Slot'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appointments:
    post:
      tags: [appointments]
      summary: Book a slot
      description: |
        Books a published slot for the patient. Slot contention is resolved by
        first write wins; losers get 409 `SLOT_UNAVAILABLE` and should refresh
        the slot list rather than retrying blindly.

        Booking does not create a consultation. The consultation opens at
        `POST /appointments/{id}/start`.
      operationId: createAppointment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_id]
              properties:
                slot_id: { type: string, format: uuid }
                care_thread_id:
                  type: string
                  format: uuid
                  description: Attach to an existing problem, or omit to open a new thread at start.
                patient_profile_id:
                  type: string
                  format: uuid
                  description: Required when booking for a dependant.
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Appointment booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [appointments]
      summary: List appointments visible to the caller
      operationId: listAppointments
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Appointments
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'

  /appointments/{appointment_id}:
    get:
      tags: [appointments]
      summary: Get one appointment
      operationId: getAppointment
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{appointment_id}/start:
    post:
      tags: [appointments]
      summary: Open the consultation for a booked appointment
      description: |
        Creates a `ConsultationRequest` already in `matched` state with the
        booked clinician assigned — it never enters the routing pool. Callable
        by either party from 15 minutes before `starts_at`.

        If the thread did not exist, it is opened here.
      operationId: startAppointment
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Consultation opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationRequest'
        '409': { $ref: '#/components/responses/Conflict' }

  /appointments/{appointment_id}/cancel:
    post:
      tags: [appointments]
      summary: Cancel an appointment and release the slot
      operationId: cancelAppointment
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '409': { $ref: '#/components/responses/Conflict' }

  /consultations:
    post:
      tags: [consultations]
      summary: Create a consultation request
      description: |
        The server computes `urgency_level` from the triage rules engine, sets
        `sla_deadline_at` from that level, and either attaches the request to
        the supplied `care_thread_id` or opens a new thread.

        Routing happens asynchronously. The response returns the request in
        `pending` state; assignment arrives over the realtime channel as
        `consultation.assigned`.

        `Idempotency-Key` is mandatory. Offline clients generate it at the
        moment the patient taps submit, not at the moment the network returns.
      operationId: createConsultation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                care_thread_id:
                  type: string
                  format: uuid
                  description: Omit to open a new thread; supply to continue an existing problem.
                patient_profile_id:
                  type: string
                  format: uuid
                  description: Required when raising on behalf of a dependant.
                clinician_id:
                  type: string
                  format: uuid
                  description: Optional verified clinician to target using the existing consultation matching rules.
                channel:
                  $ref: '#/components/schemas/Channel'
                symptom_text:
                  type: string
                  maxLength: 4000
                structured_symptoms:
                  type: array
                  description: Coded symptom entries consumed by the triage engine.
                  items:
                    $ref: '#/components/schemas/StructuredSymptom'
                voice_note_key:
                  type: string
                  description: Object-storage key for an uploaded voice note.
                location:
                  $ref: '#/components/schemas/GeoPoint'
                client_created_at:
                  type: string
                  format: date-time
                  description: When the patient actually submitted, which may precede arrival by hours offline.
      responses:
        '201':
          description: Consultation request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationRequest'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [consultations]
      summary: List consultations visible to the caller
      operationId: listConsultations
      parameters:
        - name: care_thread_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ConsultationStatus'
        - name: assigned_to_me
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Consultations
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultationRequest'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'

  /consultations/{consultation_id}:
    get:
      tags: [consultations]
      summary: Get one consultation
      operationId: getConsultation
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
      responses:
        '200':
          description: Consultation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationRequest'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /consultations/{consultation_id}/accept:
    post:
      tags: [consultations]
      summary: Accept a consultation from the queue
      description: |
        Legal source states: `pending`, `escalated`. Acceptance is a race — when
        a request has been broadcast to several candidates, the first accept
        wins and the rest receive 409 `CONSULTATION_ALREADY_ASSIGNED`. Clients
        must handle that as a normal outcome, not an error to surface loudly.

        Rejected if the caller is not verified.
      operationId: acceptConsultation
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Accepted and assigned to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationRequest'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /consultations/{consultation_id}/decline:
    post:
      tags: [consultations]
      summary: Decline a consultation and return it to the routing pool
      description: |
        Declining does not stop the SLA clock. The routing engine immediately
        re-ranks and pushes to the next candidate.
      operationId: declineConsultation
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [out_of_specialty, language_mismatch, at_capacity, other]
                note: { type: string }
      responses:
        '200':
          description: Declined and returned to pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationRequest'
        '409': { $ref: '#/components/responses/Conflict' }

  /consultations/{consultation_id}/complete:
    post:
      tags: [consultations]
      summary: Close a consultation with a signed clinical note
      description: |
        The composite write of the system. In one atomic, idempotent call the
        clinician submits the note, an optional prescription, and an optional
        follow-up cycle. Doing this as one call rather than three is deliberate:
        over an unreliable network, three sequential writes can leave a
        consultation closed with no follow-up attached.

        The server validates that the caller is verified and is the assigned
        clinician, then stamps `signed_by_clinician_id` and `signed_at`
        server-side. Client-supplied signature fields are ignored.
      operationId: completeConsultation
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  $ref: '#/components/schemas/ConsultationNoteInput'
                prescription:
                  $ref: '#/components/schemas/PrescriptionInput'
                follow_up_cycle:
                  $ref: '#/components/schemas/FollowUpCycleInput'
                close_care_thread:
                  type: boolean
                  default: false
                  description: Set when the problem is resolved and no follow-up is warranted.
      responses:
        '200':
          description: Consultation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationCompletionResult'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /consultations/{consultation_id}/refer:
    post:
      tags: [consultations]
      summary: Refer to a specialist for a second opinion
      description: |
        Creates a linked consultation on the same care thread, assigned to the
        specialist pool or to a named clinician. The original consultation
        stays open until the referring clinician completes it.
      operationId: referConsultation
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [specialty, reason]
              properties:
                specialty:
                  $ref: '#/components/schemas/Specialty'
                to_clinician_id:
                  type: string
                  format: uuid
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Referral consultation created on the same thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationRequest'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /triage-rulesets:
    get:
      tags: [system]
      summary: List triage rulesets
      description: |
        Every version ever published, newest first. Platform admin only.

        Rulesets are immutable once created, including drafts: editing means
        creating a new version. `ConsultationRequest.triage_rule_version` points
        at one of these, so a decision made months ago must still resolve to the
        rules that actually made it.
      operationId: listTriageRulesets
      responses:
        '200':
          description: Rulesets
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TriageRuleset' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [system]
      summary: Create a draft ruleset
      description: |
        Optionally cloned from an existing version. Structural validation runs
        here; the safety checks run at activation.
      operationId: createTriageRuleset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  maxLength: 40
                  description: Stamped onto every consultation this ruleset judges.
                clone_from:
                  type: string
                  description: Label of an existing version to copy as a starting point.
                rules: { type: object, additionalProperties: true }
                sla_seconds: { type: object, additionalProperties: true }
                notes: { type: string }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageRuleset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /triage-rulesets/{label}:
    get:
      tags: [system]
      summary: Get one ruleset
      operationId: getTriageRuleset
      parameters:
        - name: label
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ruleset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageRuleset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /triage-rulesets/{label}/preview:
    post:
      tags: [system]
      summary: Dry-run a ruleset
      description: |
        Runs the safety checks and, optionally, one sample presentation, without
        changing anything. Intended to be used before activation rather than
        after a patient has been triaged by a rule nobody tested.
      operationId: previewTriageRuleset
      parameters:
        - name: label
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sample:
                  type: object
                  description: A triage input to run through this ruleset.
                  additionalProperties: true
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema:
                type: object
                required: [label, safety_checks, all_passed]
                properties:
                  label: { type: string }
                  all_passed: { type: boolean }
                  safety_checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        expected: { type: string }
                        got: { type: string }
                        passed: { type: boolean }
                  sample_result:
                    type: [object, 'null']
                    additionalProperties: true
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /triage-rulesets/{label}/activate:
    post:
      tags: [system]
      summary: Activate a ruleset
      description: |
        Retires whatever was active and makes this one live. Refused if any
        safety check fails.

        A hardcoded floor guarantees a small set of presentations — stroke
        signs, chest pain, severe bleeding, unconsciousness, suicidal ideation
        and a few others — are always emergencies whatever a ruleset says. That
        floor is not configurable, and activation is refused rather than quietly
        relying on it, so the administrator finds out now rather than from a
        patient outcome.

        Propagation to other service instances takes up to 30 seconds.
      operationId: activateTriageRuleset
      parameters:
        - name: label
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes:
                  type: string
                  minLength: 1
                  description: Why this change is being made. Required — a rule change nobody explained is one nobody can review.
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageRuleset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /queue:
    get:
      tags: [queue]
      summary: The clinician's live queue
      description: |
        Cursor paginated, never page paginated — the queue mutates while it is
        being read, and offset pagination would skip or duplicate cases.

        Ordering is by urgency, then SLA deadline ascending. Clients should
        treat this as a backfill for the realtime stream, not as a polling
        loop: poll no more than once every 30 seconds.
      operationId: getQueue
      parameters:
        - name: scope
          in: query
          description: |
            `offered` — cases pushed to this clinician and awaiting accept.
            `mine` — cases already accepted and in progress.
          schema:
            type: string
            enum: [offered, mine]
            default: offered
        - name: urgency_level
          in: query
          schema:
            $ref: '#/components/schemas/UrgencyLevel'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Queue entries
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueueEntry'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '403': { $ref: '#/components/responses/Forbidden' }

  /consultations/{consultation_id}/queue-status:
    get:
      tags: [queue]
      summary: The patient's own view of where they stand
      description: |
        The counterpart to the clinician queue. A patient waiting is entitled to
        know how long — an unexplained wait is the experience the platform
        exists to remove.

        `estimated_wait_minutes` is a forecast, not a promise, and the client
        must present it as such. It is null when no reliable estimate exists,
        which is honest and better than a fabricated number.
      operationId: getQueueStatus
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
      responses:
        '200':
          description: Queue status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatus'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /consultations/{consultation_id}/note:
    get:
      tags: [consultations]
      summary: Retrieve the signed clinical note
      description: |
        Readable by the patient, the signing clinician, any clinician with an
        open consultation on the same thread, and admins with a logged reason.
        Every read is written to the audit log.
      operationId: getConsultationNote
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
      responses:
        '200':
          description: Consultation note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationNote'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------
  # Phase 3 — Follow-up and adherence
  # ----------------------------------------------------------------------

  /follow-up-cycles/{follow_up_cycle_id}:
    get:
      tags: [follow-up]
      summary: Get a follow-up cycle
      operationId: getFollowUpCycle
      parameters:
        - $ref: '#/components/parameters/FollowUpCycleId'
      responses:
        '200':
          description: Follow-up cycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpCycle'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /follow-up-cycles/{follow_up_cycle_id}/check-ins:
    get:
      tags: [follow-up]
      summary: List check-ins on a cycle
      description: |
        Includes future scheduled check-ins as well as answered ones, so the
        patient app can show what is coming and cache it for offline use.
      operationId: listCheckIns
      parameters:
        - $ref: '#/components/parameters/FollowUpCycleId'
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, responded, missed]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Check-ins
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckIn'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'

  /check-ins:
    get:
      tags: [follow-up]
      summary: List the caller's own check-ins
      description: |
        Answering a check-in was already described, but there was no way to
        find the ones waiting — a patient could only respond if something else
        handed them an id. Scoped like `/adherence-logs`: a patient or guardian
        sees their own, a clinician sees the cycles they own.
      operationId: listMyCheckIns
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, responded, missed]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Check-ins
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CheckIn' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /check-ins/{check_in_id}/respond:
    post:
      tags: [follow-up]
      summary: Submit answers to a scheduled check-in
      description: |
        The server evaluates the answers against the cycle's `recovery_criteria`
        and sets `is_deviation` itself — the client never computes or sends it.
        A deviation raises a high-priority review task for the assigned
        clinician and pushes `checkin.deviation` over the realtime channel.

        Offline capable: answers are queued locally and replayed through
        `POST /sync/batch`.
      operationId: respondToCheckIn
      parameters:
        - $ref: '#/components/parameters/CheckInId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responses]
              properties:
                responses:
                  type: object
                  description: Answers keyed by question id, plus any reported vitals.
                  additionalProperties: true
                channel:
                  $ref: '#/components/schemas/Channel'
                client_created_at: { type: string, format: date-time }
      responses:
        '200':
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /follow-up-cycles/{follow_up_cycle_id}/close:
    post:
      tags: [follow-up]
      summary: Close a follow-up cycle
      description: |
        Clinician only. Cycles also close automatically when recovery criteria
        are met; this endpoint is the manual override.
      operationId: closeFollowUpCycle
      parameters:
        - $ref: '#/components/parameters/FollowUpCycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [recovered, escalated, lost_to_follow_up]
                notes: { type: string }
      responses:
        '200':
          description: Cycle closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpCycle'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /prescriptions/{prescription_id}:
    get:
      tags: [medications]
      summary: Get a prescription with its items
      operationId: getPrescription
      parameters:
        - $ref: '#/components/parameters/PrescriptionId'
      responses:
        '200':
          description: Prescription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patient-profiles/{patient_profile_id}/prescriptions:
    get:
      tags: [medications]
      summary: List a patient's prescriptions
      operationId: listPatientPrescriptions
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, discontinued]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Prescriptions
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Prescription'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '403': { $ref: '#/components/responses/Forbidden' }

  /patient-profiles/{patient_profile_id}/audit-history:
    get:
      tags: [audit]
      summary: Read the caller's own consent and emergency access history
      description: Patient role only. The caller must own or be the guardian of this profile. Hashes, actors, request IDs, reasons and arbitrary metadata are omitted.
      operationId: listOwnConsentAuditHistory
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
      responses:
        '200':
          description: Patient-safe history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientAuditHistory' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /adherence-logs:
    get:
      tags: [medications]
      summary: The patient's dose schedule
      description: |
        Every dose the system expects, past and upcoming, generated from the
        prescription's frequency and duration at the moment it was created.

        The client caches the coming window so the reminder still fires with no
        connectivity, and queues confirmations for replay.
      operationId: listAdherenceLogs
      parameters:
        - name: patient_profile_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: reported_status
          in: query
          schema:
            $ref: '#/components/schemas/AdherenceStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Dose schedule
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdherenceLog'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'

  /adherence-logs/{adherence_log_id}/confirm:
    post:
      tags: [medications]
      summary: Report whether a scheduled dose was taken
      description: |
        Reachable from an app notification, an SMS reply, or a USSD menu — the
        gateway translates all three into this same call.

        Repeated missed doses on the same prescription raise a task for the
        assigned clinician. That escalation is the whole point of the feature:
        recording non-adherence without acting on it changes nothing.
      operationId: confirmAdherence
      parameters:
        - $ref: '#/components/parameters/AdherenceLogId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reported_status]
              properties:
                reported_status:
                  $ref: '#/components/schemas/AdherenceStatus'
                channel:
                  $ref: '#/components/schemas/Channel'
                note:
                  type: string
                  maxLength: 500
                  description: Optional patient comment, e.g. why a dose was skipped.
                client_created_at: { type: string, format: date-time }
      responses:
        '200':
          description: Dose recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdherenceLog'
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------------------
  # Phase 2 — Channel gateway (internal, aggregator-facing)
  # ----------------------------------------------------------------------

  /gateway/ussd/session:
    post:
      tags: [gateway]
      summary: Handle one USSD menu interaction
      description: |
        Called by the telecom aggregator on every key press. The bridge holds
        session state in Redis keyed by `session_id` and translates the
        selection into an ordinary internal API call — the same
        `POST /consultations` the app uses. There is exactly one implementation
        of the business rules, and the channel never forks it.

        Not part of the public API. Authenticated by shared secret and source-IP
        allow-list, not by JWT. Responses must fit the aggregator's session
        timeout and character limit.
      operationId: handleUssdSession
      security:
        - gatewaySignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, phone_number, text]
              properties:
                session_id: { type: string }
                phone_number:
                  $ref: '#/components/schemas/PhoneNumber'
                service_code: { type: string }
                text:
                  type: string
                  description: Accumulated input so far, aggregator convention.
      responses:
        '200':
          description: Menu or terminal response
          content:
            application/json:
              schema:
                type: object
                required: [response, terminate]
                properties:
                  response:
                    type: string
                    maxLength: 182
                  terminate:
                    type: boolean
                    description: True ends the USSD session.

  /gateway/sms/inbound:
    post:
      tags: [gateway]
      summary: Handle an inbound SMS keyword
      description: |
        Maps keywords to internal calls — for example a dose confirmation reply
        becomes `POST /adherence-logs/{id}/confirm`. Unrecognised text is routed
        to the patient's open care thread as a message rather than discarded.
      operationId: handleInboundSms
      security:
        - gatewaySignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, text, received_at]
              properties:
                from:
                  $ref: '#/components/schemas/PhoneNumber'
                to: { type: string }
                text: { type: string }
                received_at: { type: string, format: date-time }
                aggregator_message_id: { type: string }
      responses:
        '202':
          description: Accepted for processing
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ----------------------------------------------------------------------
  # Facilities — the hospital-facing surface
  # ----------------------------------------------------------------------

  /facilities:
    get:
      tags: [facilities]
      summary: List facilities
      description: |
        The directory a patient browses when choosing where to go. Filterable
        by type and region; ordered by distance when a location is supplied.
      operationId: listFacilities
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/FacilityType' }
        - name: region_code
          in: query
          schema: { type: string }
        - name: lat
          in: query
          schema: { type: number }
        - name: lng
          in: query
          schema: { type: number }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Facilities
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Facility' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /facilities/{facility_id}:
    get:
      tags: [facilities]
      summary: Get one facility
      operationId: getFacility
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Facility
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facility' }
        '404': { $ref: '#/components/responses/NotFound' }

  /facilities/{facility_id}/departments:
    get:
      tags: [facilities]
      summary: List a facility's departments
      operationId: listDepartments
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Department' }
        '404': { $ref: '#/components/responses/NotFound' }

  /facilities/{facility_id}/queue:
    get:
      tags: [facilities]
      summary: Live queue and provider availability at a facility
      description: |
        The congestion feature. A patient standing in a crowded outpatient hall
        opens this and sees which clinicians are on duty, how many people are
        ahead of each, and the estimated wait — then books rather than guesses.

        Requires the facility to be integrated. Facilities that are not report
        `integration_level: none` and an empty provider list rather than a
        fabricated estimate.
      operationId: getFacilityQueue
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - name: department_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Live queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityQueue' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------
  # AI — assistant and decision support. Advisory, never determinative.
  # ----------------------------------------------------------------------

  /ai/conversations:
    post:
      tags: [ai]
      summary: Open an assistant conversation
      description: |
        Opens an authenticated conversation. The default local provider is a
        deterministic navigation and emergency-keyword stub, not a clinical
        knowledge-base search. This endpoint does not fetch patient profile,
        care-thread, or family-member records. Optional identifiers are stored
        as conversation metadata only.
      operationId: createAiConversation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience]
              properties:
                audience:
                  $ref: '#/components/schemas/AiAudience'
                care_thread_id: { type: string, format: uuid }
                patient_profile_id: { type: string, format: uuid }
                language: { $ref: '#/components/schemas/LanguageCode' }
                channel: { $ref: '#/components/schemas/Channel' }
      responses:
        '201':
          description: Conversation opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConversation' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ai/conversations/{conversation_id}:
    get:
      tags: [ai]
      summary: Get a conversation with its messages
      operationId: getAiConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConversationDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ai/conversations/{conversation_id}/messages:
    post:
      tags: [ai]
      summary: Send a message to the configured assistant provider
      description: |
        The response may include one structured navigation suggestion from the
        configured provider and `escalated` when the local stub recognizes a
        configured red-flag phrase. Navigation suggestions are untrusted
        metadata: clients must use a strict application allowlist and must
        never interpret message text as a route or command. Emergency
        navigation requires a separate patient action and never dispatches SOS.
      operationId: createAiMessage
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4000 }
                voice_note_key: { type: string }
      responses:
        '201':
          description: Assistant reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiReply' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /ai/triage:
    post:
      tags: [ai]
      summary: Suggest an urgency level from reported symptoms
      description: |
        Advisory input to triage, not a replacement for it. The consultation
        service records both the deterministic rules-engine result and this
        suggestion; where they disagree the more urgent wins, and the
        disagreement is logged for clinical review.

        Never returns a diagnosis.
      operationId: aiTriage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symptom_text: { type: string, maxLength: 4000 }
                structured_symptoms:
                  type: array
                  items: { $ref: '#/components/schemas/StructuredSymptom' }
                patient_profile_id: { type: string, format: uuid }
      responses:
        '200':
          description: Suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageSuggestion' }

  /ai/drug-interactions:
    post:
      tags: [ai]
      summary: Check a set of medications for interactions
      description: |
        Clinician-facing. Returns findings with severity and the source of each
        one; the prescribing decision remains the clinician's.
      operationId: checkDrugInteractions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medications]
              properties:
                medications:
                  type: array
                  minItems: 1
                  items: { type: string }
                patient_profile_id: { type: string, format: uuid }
      responses:
        '200':
          description: Findings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrugInteractionReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ai/transcribe:
    post:
      tags: [ai]
      summary: Transcribe a voice note
      description: |
        Speech to text for patients who would rather speak than type, and for
        clinicians dictating notes. Returns a confidence score; low-confidence
        Swahili output must be shown for correction rather than filed silently.
      operationId: aiTranscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audio_key]
              properties:
                audio_key: { type: string }
                language: { $ref: '#/components/schemas/LanguageCode' }
      responses:
        '200':
          description: Transcript
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcript' }

  /ai/synthesize:
    post:
      tags: [ai]
      summary: Render text as speech
      description: |
        For low-literacy users and voice-channel delivery. Returns an object
        key the client fetches, not audio bytes inline.
      operationId: aiSynthesize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
                language: { $ref: '#/components/schemas/LanguageCode' }
      responses:
        '200':
          description: Audio reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  audio_key: { type: string }
                  duration_seconds: { type: number }

  /ai/models:
    get:
      tags: [ai]
      summary: Registry of deployed models
      description: |
        Admin and clinical-governance view: which model serves which function,
        at which version, when it was last validated, and its current accuracy
        and bias monitoring status.

        A model with no recorded validation must be visible as such. This is
        the register the AI governance committee reviews.
      operationId: listAiModels
      responses:
        '200':
          description: Models
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AiModel' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # Emergency and transport
  # ----------------------------------------------------------------------

  /emergency-requests:
    post:
      tags: [emergency]
      summary: Raise an emergency
      description: |
        Reachable from the app's single prominent emergency action, from USSD,
        from SMS, and from a device alert. `scale` distinguishes an individual
        emergency from a mass-casualty incident so the receiving facility can
        mobilise proportionately before the first patient arrives.

        Deliberately tolerant of missing information. Someone reporting a road
        crash may know nothing but where they are.
      operationId: createEmergencyRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scale, location]
              properties:
                scale: { $ref: '#/components/schemas/EmergencyScale' }
                category: { $ref: '#/components/schemas/EmergencyCategory' }
                location: { $ref: '#/components/schemas/GeoPoint' }
                patient_profile_id: { type: string, format: uuid }
                estimated_casualties: { type: integer, minimum: 1 }
                description: { type: string, maxLength: 2000 }
                reporter_phone: { $ref: '#/components/schemas/PhoneNumber' }
                source: { $ref: '#/components/schemas/EmergencySource' }
                channel: { $ref: '#/components/schemas/Channel' }
      responses:
        '201':
          description: Emergency raised and routed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [emergency]
      summary: List emergencies
      description: Dispatcher and facility view. Cursor paginated, most urgent first.
      operationId: listEmergencyRequests
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EmergencyStatus' }
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Emergencies
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EmergencyRequest' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /emergency-requests/{emergency_id}:
    get:
      tags: [emergency]
      summary: Get one emergency
      operationId: getEmergencyRequest
      parameters:
        - $ref: '#/components/parameters/EmergencyId'
      responses:
        '200':
          description: Emergency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emergency-requests/{emergency_id}/dispatch:
    post:
      tags: [emergency]
      summary: Assign transport and a receiving facility
      description: |
        Dispatcher action. Assigning transport also notifies the receiving
        facility's emergency department with whatever patient context consent
        allows — known conditions, allergies, current medications — so the team
        is prepared rather than meeting an anonymous arrival.
      operationId: dispatchEmergency
      parameters:
        - $ref: '#/components/parameters/EmergencyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transport_unit_id, destination_facility_id]
              properties:
                transport_unit_id: { type: string, format: uuid }
                destination_facility_id: { type: string, format: uuid }
                notes: { type: string }
      responses:
        '200':
          description: Dispatched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /emergency-requests/{emergency_id}/status:
    post:
      tags: [emergency]
      summary: Advance the emergency through its lifecycle
      description: |
        Legal transitions only. An emergency cannot be closed without an
        outcome — a request that simply disappears is the failure mode this
        whole subsystem exists to prevent.
      operationId: setEmergencyStatus
      parameters:
        - $ref: '#/components/parameters/EmergencyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/EmergencyStatus' }
                outcome: { $ref: '#/components/schemas/EmergencyOutcome' }
                notes: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transport-units:
    get:
      tags: [emergency]
      summary: List transport units
      operationId: listTransportUnits
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TransportStatus' }
        - name: near_lat
          in: query
          schema: { type: number }
        - name: near_lng
          in: query
          schema: { type: number }
      responses:
        '200':
          description: Units
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TransportUnit' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /transport-units/{unit_id}/location:
    put:
      tags: [emergency]
      summary: Report a unit's position
      description: |
        High frequency, low value individually. Written to a hot store and
        summarised into the audit trail rather than appended row by row.
      operationId: updateTransportLocation
      parameters:
        - $ref: '#/components/parameters/UnitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location]
              properties:
                location: { $ref: '#/components/schemas/GeoPoint' }
                heading_degrees: { type: number }
                speed_kph: { type: number }
      responses:
        '204':
          description: Recorded
        '403': { $ref: '#/components/responses/Forbidden' }

  /transport-units/{unit_id}/status:
    post:
      tags: [emergency]
      summary: Set a unit's availability
      operationId: setTransportStatus
      parameters:
        - $ref: '#/components/parameters/UnitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TransportStatus' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportUnit' }

  # ----------------------------------------------------------------------
  # Devices — wearables and vehicle sensors
  # ----------------------------------------------------------------------

  /devices:
    post:
      tags: [devices]
      summary: Register a device
      description: |
        Binds a wearable to a patient, or a sensor to a vehicle. The device
        credential is returned once and never again; losing it means
        re-registering, which is the correct trade for a credential that can
        raise an emergency.
      operationId: registerDevice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_type, serial_number]
              properties:
                device_type: { $ref: '#/components/schemas/DeviceType' }
                serial_number: { type: string, maxLength: 100 }
                patient_profile_id: { type: string, format: uuid }
                vehicle_registration: { type: string, maxLength: 40 }
                label: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegistration' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [devices]
      summary: List devices visible to the caller
      operationId: listDevices
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /devices/{device_id}/telemetry:
    post:
      tags: [devices]
      summary: Ingest a batch of readings
      description: |
        Batched because a watch on a patchy network buffers for hours. Each
        reading carries its own timestamp from the device; arrival order means
        nothing.

        Authenticated by the device credential, not a user session.
      operationId: ingestTelemetry
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [readings]
              properties:
                readings:
                  type: array
                  maxItems: 500
                  items: { $ref: '#/components/schemas/TelemetryReading' }
      responses:
        '202':
          description: Accepted
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /devices/{device_id}/alerts:
    post:
      tags: [devices]
      summary: Raise a device alert
      description: |
        A fall, a collision pattern, or a vital sign outside its bounds. Fans
        out simultaneously to the last treating clinician, the assigned family
        doctor, the nearest facility's emergency department, registered
        relatives, and the patient's own phone.

        Because the device is bound to a health record, responders receive
        context rather than an anonymous signal.
      operationId: raiseDeviceAlert
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alert_type, detected_at]
              properties:
                alert_type: { $ref: '#/components/schemas/DeviceAlertType' }
                detected_at: { type: string, format: date-time }
                location: { $ref: '#/components/schemas/GeoPoint' }
                confidence: { type: number, minimum: 0, maximum: 1 }
                readings:
                  type: array
                  items: { $ref: '#/components/schemas/TelemetryReading' }
      responses:
        '201':
          description: Alert raised, emergency opened where warranted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAlert' }

  /devices/{device_id}/revoke:
    post:
      tags: [devices]
      summary: Revoke a device
      operationId: revokeDevice
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Revoked
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # Prevention — risk, screening, vaccination
  # ----------------------------------------------------------------------

  /patient-profiles/{patient_profile_id}/risk-scores:
    get:
      tags: [prevention]
      summary: A patient's current risk scores
      description: |
        Model output presented as a prompt for clinical attention, never as a
        finding. Every score carries the model and version that produced it and
        the features that drove it, because a score nobody can interrogate
        cannot be acted on responsibly.
      operationId: listRiskScores
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
      responses:
        '200':
          description: Risk scores
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RiskScore' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /patient-profiles/{patient_profile_id}/risk-scores/compute:
    post:
      tags: [prevention]
      summary: Recompute risk scores
      operationId: computeRiskScores
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                conditions:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Recomputed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RiskScore' }

  /screening-programmes:
    get:
      tags: [prevention]
      summary: List screening programmes
      description: |
        Cervical, breast, prostate, hypertension, diabetes, TB and others, each
        with its eligibility rule and interval. The catalogue the invitation
        engine draws from.
      operationId: listScreeningProgrammes
      responses:
        '200':
          description: Programmes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScreeningProgramme' }

  /screening-invitations:
    get:
      tags: [prevention]
      summary: List screening invitations
      operationId: listScreeningInvitations
      parameters:
        - name: patient_profile_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvitationStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScreeningInvitation' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /screening-invitations/{invitation_id}/respond:
    post:
      tags: [prevention]
      summary: Respond to a screening invitation
      description: |
        Accepting books an appointment where slots exist. Declining records the
        reason, which is the data that tells you whether uptake is limited by
        distance, cost, fear, or simply not knowing what the test is for.
      operationId: respondToInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
                  enum: [accept, decline, defer]
                decline_reason: { type: string, maxLength: 500 }
                preferred_slot_id: { type: string, format: uuid }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningInvitation' }

  /patient-profiles/{patient_profile_id}/vaccinations:
    get:
      tags: [prevention]
      summary: Vaccination history and schedule
      operationId: listVaccinations
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
      responses:
        '200':
          description: Vaccinations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Vaccination' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [prevention]
      summary: Record a dose
      operationId: recordVaccination
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaccine_code, administered_at]
              properties:
                vaccine_code: { type: string }
                dose_number: { type: integer, minimum: 1 }
                administered_at: { type: string, format: date-time }
                facility_id: { type: string, format: uuid }
                batch_number: { type: string }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vaccination' }

  # ----------------------------------------------------------------------
  # Pharmacy — availability and the dispensing handoff
  # ----------------------------------------------------------------------

  /pharmacies:
    get:
      tags: [pharmacy]
      summary: List participating pharmacies
      operationId: listPharmacies
      parameters:
        - name: lat
          in: query
          schema: { type: number }
        - name: lng
          in: query
          schema: { type: number }
        - name: radius_km
          in: query
          schema: { type: number, default: 10 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pharmacies
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Pharmacy' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /pharmacies/medication-search:
    get:
      tags: [pharmacy]
      summary: Find a medication in stock nearby
      description: |
        A prescription is not treatment; obtaining the medicine is. When the
        point of care has none, this answers where it is — with distance and
        stock status visible before the patient travels, rather than after.
      operationId: searchMedication
      parameters:
        - name: medication_name
          in: query
          required: true
          schema: { type: string }
        - name: lat
          in: query
          required: true
          schema: { type: number }
        - name: lng
          in: query
          required: true
          schema: { type: number }
        - name: radius_km
          in: query
          schema: { type: number, default: 15 }
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MedicationAvailability' }

  /prescriptions/{prescription_id}/dispense-code:
    post:
      tags: [pharmacy]
      summary: Issue a verification code for a prescription
      description: |
        Short-lived, single-pharmacy code the patient presents at the counter.
        The pharmacist enters it to pull the prescription directly, which
        removes lost paper, proves the prescription is genuine, and keeps the
        medication record continuous across facilities.
      operationId: issueDispenseCode
      parameters:
        - $ref: '#/components/parameters/PrescriptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Code issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispenseCode' }
        '409': { $ref: '#/components/responses/Conflict' }

  /dispensing/verify:
    post:
      tags: [pharmacy]
      summary: Redeem a verification code at the counter
      description: |
        Pharmacist-facing. Returns only what dispensing requires — the items,
        the doses, and the prescriber. Not the diagnosis. Role-based access is
        the point: a pharmacist needs the medication, not the condition.
      operationId: verifyDispenseCode
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                pharmacy_id: { type: string, format: uuid }
      responses:
        '200':
          description: Prescription for dispensing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispensingView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dispensing/{dispensing_id}/complete:
    post:
      tags: [pharmacy]
      summary: Record what was actually dispensed
      description: |
        Substitution requires pharmacist review and, where the item differs
        clinically, prescriber approval. The platform never permits silent
        substitution.
      operationId: completeDispensing
      parameters:
        - $ref: '#/components/parameters/DispensingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [prescription_item_id, quantity_dispensed]
                    properties:
                      prescription_item_id: { type: string, format: uuid }
                      quantity_dispensed: { type: integer }
                      substituted_with: { type: string }
                      substitution_approved_by: { type: string, format: uuid }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispensingRecord' }

  # ----------------------------------------------------------------------
  # Diagnostics
  # ----------------------------------------------------------------------

  /investigation-orders:
    post:
      tags: [diagnostics]
      summary: Order a laboratory, imaging or pathology investigation
      operationId: createInvestigationOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [care_thread_id, investigation_code]
              properties:
                care_thread_id: { type: string, format: uuid }
                consultation_id: { type: string, format: uuid }
                investigation_code: { type: string }
                investigation_type: { $ref: '#/components/schemas/InvestigationType' }
                clinical_notes: { type: string }
                urgency: { $ref: '#/components/schemas/UrgencyLevel' }
                facility_id: { type: string, format: uuid }
      responses:
        '201':
          description: Ordered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationOrder' }
    get:
      tags: [diagnostics]
      summary: List investigation orders
      operationId: listInvestigationOrders
      parameters:
        - name: care_thread_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvestigationStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InvestigationOrder' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /investigation-orders/{order_id}:
    get:
      tags: [diagnostics]
      summary: Get one investigation order with its results
      description: |
        The read half of an order. The service has always implemented this —
        the contract simply never described it, which is the same gap-class
        as a status field with no endpoint to drive it.
      operationId: getInvestigationOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Investigation order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /investigation-orders/{order_id}/results:
    post:
      tags: [diagnostics]
      summary: File a result
      description: |
        Results outside their critical bounds set `is_critical` and raise an
        urgent review task immediately, rather than waiting for a clinician to
        open the record. A critical potassium that nobody looked at for three
        days is exactly the failure this exists to stop.
      operationId: fileInvestigationResult
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: array
                  items: { $ref: '#/components/schemas/ResultValue' }
                narrative: { type: string }
                attachment_key: { type: string }
                reported_by_id: { type: string, format: uuid }
      responses:
        '201':
          description: Result filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationOrder' }

  /investigation-orders/{order_id}/acknowledge:
    post:
      tags: [diagnostics]
      summary: Acknowledge a critical result
      description: |
        Closes the loop on an urgent finding. Until a clinician acknowledges,
        the alert keeps escalating — silence is never treated as receipt.
      operationId: acknowledgeResult
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # Professional network
  # ----------------------------------------------------------------------

  /network/communities:
    get:
      tags: [network]
      summary: List specialty communities
      operationId: listCommunities
      responses:
        '200':
          description: Communities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Community' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /network/discussions:
    get:
      tags: [network]
      summary: List discussions
      operationId: listDiscussions
      parameters:
        - name: community_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Discussions
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Discussion' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [network]
      summary: Open a discussion
      description: |
        Verified clinicians only. A case discussion must reference a care
        thread, and the platform de-identifies it on the way in — the point is
        the clinical question, not the patient's identity.
      operationId: createDiscussion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [community_id, title, body]
              properties:
                community_id: { type: string, format: uuid }
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 8000 }
                is_case_discussion: { type: boolean, default: false }
                care_thread_id: { type: string, format: uuid }
      responses:
        '201':
          description: Opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discussion' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /network/discussions/{discussion_id}:
    get:
      tags: [network]
      summary: Get a discussion with its replies
      description: |
        Never joins patient identity, even for a case discussion — what is
        shared is the clinical question, de-identified on the way in; this
        endpoint has no path back to who the patient is.
      operationId: getDiscussion
      parameters:
        - name: discussion_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Discussion with replies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Discussion'
                  - type: object
                    properties:
                      replies:
                        type: array
                        items: { $ref: '#/components/schemas/DiscussionReply' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /network/discussions/{discussion_id}/replies:
    post:
      tags: [network]
      summary: Reply to a discussion
      operationId: replyToDiscussion
      parameters:
        - $ref: '#/components/parameters/DiscussionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 8000 }
      responses:
        '201':
          description: Reply posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscussionReply' }

  /network/second-opinions:
    get:
      tags: [network]
      summary: List second-opinion requests
      description: |
        How a specialist finds open requests to claim. Store-and-forward by
        design — no requirement that requester and specialist are online at
        once, which is what makes specialist access work outside cities.
      operationId: listSecondOpinions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, claimed, answered, withdrawn]
        - name: specialty
          in: query
          schema: { $ref: '#/components/schemas/Specialty' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Second opinions
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SecondOpinion' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
    post:
      tags: [network]
      summary: Request a specialist second opinion
      description: |
        Store-and-forward by default: a rural clinician submits history,
        images and results, and a specialist answers when able. No requirement
        that both are online at once, because that requirement is what makes
        specialist access fail outside cities.
      operationId: requestSecondOpinion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [care_thread_id, specialty, question]
              properties:
                care_thread_id: { type: string, format: uuid }
                specialty: { $ref: '#/components/schemas/Specialty' }
                question: { type: string, maxLength: 4000 }
                attachment_keys:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondOpinion' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /network/second-opinions/{second_opinion_id}/claim:
    post:
      tags: [network]
      summary: Claim an open second-opinion request
      description: The specialist taking it on. Only legal while status is `open`.
      operationId: claimSecondOpinion
      parameters:
        - name: second_opinion_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondOpinion' }
        '409': { $ref: '#/components/responses/Conflict' }

  /network/second-opinions/{second_opinion_id}/answer:
    post:
      tags: [network]
      summary: Answer a claimed second-opinion request
      description: Only the clinician who claimed it may answer. Only legal while status is `claimed`.
      operationId: answerSecondOpinion
      parameters:
        - name: second_opinion_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, maxLength: 8000 }
      responses:
        '200':
          description: Answered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondOpinion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------------------
  # Health education
  # ----------------------------------------------------------------------

  /education/topics:
    post:
      tags: [education]
      summary: Create a topic
      description: Admin only. The category an article is filed under.
      operationId: createEducationTopic
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, category]
              properties:
                slug: { type: string, maxLength: 80 }
                name: { type: string, maxLength: 150 }
                category:
                  type: string
                  enum: [communicable, non_communicable, maternal_child, mental_health, prevention, nutrition]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EducationTopic' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [education]
      summary: List education topics
      operationId: listEducationTopics
      parameters:
        - name: language
          in: query
          schema: { $ref: '#/components/schemas/LanguageCode' }
      responses:
        '200':
          description: Topics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EducationTopic' }

  /education/articles:
    post:
      tags: [education]
      summary: Author a draft article
      description: |
        Clinician or admin. Created unpublished — a clinical reviewer must
        publish it (a separate action) before it reaches patients, so nothing
        goes out to a low-literacy, low-bandwidth audience unreviewed.
      operationId: createEducationArticle
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic_slug, slug, title, summary, language]
              properties:
                topic_slug: { type: string }
                slug: { type: string, maxLength: 120 }
                title: { type: string, maxLength: 200 }
                summary: { type: string }
                body: { type: string }
                language: { $ref: '#/components/schemas/LanguageCode' }
                format: { $ref: '#/components/schemas/ContentFormat' }
                reading_level:
                  type: string
                  enum: [basic, intermediate, advanced]
                media_key: { type: string }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EducationArticle' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [education]
      summary: List education articles
      description: |
        Multilingual and reading-level aware. `format` covers written, audio
        and video, because literacy and bandwidth both vary and neither should
        decide whether someone can learn what a warning sign looks like.
      operationId: listEducationArticles
      parameters:
        - name: topic_slug
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { $ref: '#/components/schemas/LanguageCode' }
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/ContentFormat' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Articles
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EducationArticle' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /education/articles/{slug}/publish:
    post:
      tags: [education]
      summary: Review and publish a draft article
      description: Clinician or admin. Sets the reviewer and makes the article visible to GET /education/articles.
      operationId: publishEducationArticle
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: language
          in: query
          required: true
          schema: { $ref: '#/components/schemas/LanguageCode' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EducationArticle' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /education/articles/{slug}:
    get:
      tags: [education]
      summary: Get one article
      operationId: getEducationArticle
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: language
          in: query
          schema: { $ref: '#/components/schemas/LanguageCode' }
      responses:
        '200':
          description: Article
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EducationArticle' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------
  # Families — one family, one doctor
  # ----------------------------------------------------------------------

  /families:
    post:
      tags: [families]
      summary: Create a family group
      operationId: createFamily
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 150 }
                subscription_tier: { $ref: '#/components/schemas/SubscriptionTier' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }

  /families/me:
    get:
      tags: [families]
      summary: The caller's family, members and assigned doctors
      operationId: getMyFamily
      responses:
        '200':
          description: Family
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /families/{family_id}/members:
    post:
      tags: [families]
      summary: Add a member
      operationId: addFamilyMember
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_profile_id, relationship]
              properties:
                patient_profile_id: { type: string, format: uuid }
                relationship: { $ref: '#/components/schemas/FamilyRelationship' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyMember' }
        '409': { $ref: '#/components/responses/Conflict' }

  /families/{family_id}/assignments:
    post:
      tags: [families]
      summary: Assign the family's doctors
      description: |
        Two assignments, not one: a general practitioner for overall family
        health, and an obstetrics-and-gynaecology clinician for maternal and
        reproductive care. Pregnancy handled by whoever happens to be free is
        the outcome this pairing exists to prevent.

        Assignment draws on the employed-clinician panel with a bounded number
        of families each, so the promise has a delivery mechanism behind it
        rather than being a slogan.
      operationId: assignFamilyDoctors
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gp_clinician_id: { type: string, format: uuid }
                obgyn_clinician_id: { type: string, format: uuid }
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyDetail' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------------------
  # Research and surveillance
  # ----------------------------------------------------------------------

  /research/datasets:
    get:
      tags: [research]
      summary: List available de-identified datasets
      description: |
        Every dataset states its de-identification method, its k-anonymity
        threshold, and the ethics approval required to query it. Access to
        patient-level data is not offered here at any approval level.
      operationId: listResearchDatasets
      responses:
        '200':
          description: Datasets
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ResearchDataset' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /research/queries:
    post:
      tags: [research]
      summary: Submit an aggregate query
      description: |
        Aggregates only. Results below the dataset's minimum cell size are
        suppressed rather than returned, because a count of one in a district
        is an identity.

        Requires a current ethics approval reference, which is recorded against
        the query in the audit trail.
      operationId: submitResearchQuery
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id, ethics_approval_ref, query]
              properties:
                dataset_id: { type: string, format: uuid }
                ethics_approval_ref: { type: string, maxLength: 100 }
                query: { $ref: '#/components/schemas/AggregateQuery' }
      responses:
        '202':
          description: Accepted for execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchQuery' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /research/queries/{query_id}:
    get:
      tags: [research]
      summary: Retrieve query results
      operationId: getResearchQuery
      parameters:
        - $ref: '#/components/parameters/QueryId'
      responses:
        '200':
          description: Query and results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchQuery' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /surveillance/conditions:
    get:
      tags: [surveillance]
      summary: Leading diagnosed conditions by geography
      description: |
        Aggregated and de-identified. Available at ward, district, region,
        national and — as the platform expands — continental level, starting
        in Tanzania.

        This is the standing evidence base for government engagement: instead
        of arguing for support in the abstract, showing in near real time where
        the gaps actually are.
      operationId: getSurveillanceConditions
      parameters:
        - name: level
          in: query
          required: true
          schema: { $ref: '#/components/schemas/GeoLevel' }
        - name: area_code
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Ranked conditions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ConditionCount' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /surveillance/trends:
    get:
      tags: [surveillance]
      summary: Trend and outbreak signal for one condition
      description: |
        Time series with a modelled expected range. A district's malaria count
        rising above its expected band is the signal that lets a health
        authority act before a local rise becomes an outbreak.
      operationId: getSurveillanceTrends
      parameters:
        - name: condition_code
          in: query
          required: true
          schema: { type: string }
        - name: level
          in: query
          required: true
          schema: { $ref: '#/components/schemas/GeoLevel' }
        - name: area_code
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Trend
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrendSeries' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # Insurance
  # ----------------------------------------------------------------------

  /insurance/coverage:
    get:
      tags: [insurance]
      summary: Check coverage before a visit
      description: |
        Access is incomplete when a patient can find care but cannot afford it.
        This answers what is covered, by whom, and where it is accepted —
        before travelling, not at the counter.
      operationId: getInsuranceCoverage
      parameters:
        - name: patient_profile_id
          in: query
          schema: { type: string, format: uuid }
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Coverage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsuranceCoverage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /insurance/claims:
    post:
      tags: [insurance]
      summary: Submit a claim
      operationId: submitInsuranceClaim
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consultation_id, scheme_id]
              properties:
                consultation_id: { type: string, format: uuid }
                scheme_id: { type: string, format: uuid }
                item_codes:
                  type: array
                  items: { type: string }
      responses:
        '202':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsuranceClaim' }
    get:
      tags: [insurance]
      summary: List claims
      operationId: listInsuranceClaims
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ClaimStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Claims
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InsuranceClaim' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  # ----------------------------------------------------------------------
  # Quality — ratings and incidents
  # ----------------------------------------------------------------------

  /consultations/{consultation_id}/rating:
    post:
      tags: [quality]
      summary: Rate a completed consultation
      description: |
        Patient-facing, one rating per consultation. Feeds the clinician's
        average, which is one input to routing — not the only one, because
        ranking purely on rating pushes difficult cases away from the people
        best able to handle them.
      operationId: rateConsultation
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationRating' }
        '409': { $ref: '#/components/responses/Conflict' }

  /incident-reports:
    post:
      tags: [quality]
      summary: Report a patient-safety incident or misconduct
      description: |
        Open to patients and staff. Serious categories escalate directly to
        clinical and governance leadership rather than entering a
        customer-service queue.

        The stated purpose of this process is improvement, not punishment:
        identifying training needs and system weaknesses so the platform gets
        safer over time.
      operationId: createIncidentReport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description]
              properties:
                category: { $ref: '#/components/schemas/IncidentCategory' }
                severity: { $ref: '#/components/schemas/IncidentSeverity' }
                description: { type: string, maxLength: 4000 }
                consultation_id: { type: string, format: uuid }
                clinician_id: { type: string, format: uuid }
                facility_id: { type: string, format: uuid }
                anonymous: { type: boolean, default: false }
      responses:
        '201':
          description: Reported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentReport' }
    get:
      tags: [quality]
      summary: List incident reports
      operationId: listIncidentReports
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/IncidentStatus' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/IncidentSeverity' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/IncidentReport' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # Cross-cutting — offline sync
  # ----------------------------------------------------------------------

  /sync/changes:
    get:
      tags: [sync]
      summary: Pull everything that changed since the client last synced
      description: |
        The read half of offline support. The client stores `next_cursor` and
        presents it on the next call; the server returns every create, update
        and delete visible to the caller since that point, ordered by version.

        Deletes are returned as tombstones (`op: delete`) rather than silent
        omissions, so a client that was offline during a deletion can remove
        the local row.

        A first sync with no cursor returns a bounded snapshot of active data
        only — closed threads older than 90 days are excluded and fetched on
        demand.
      operationId: getSyncChanges
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque cursor from the previous sync. Omit for a first sync.
        - name: entities
          in: query
          description: Restrict to specific entity types. Defaults to all visible.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SyncEntity'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Changes since the cursor
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncChange'
                  meta:
                    $ref: '#/components/schemas/SyncMeta'

  /sync/batch:
    post:
      tags: [sync]
      summary: Drain the client's queued offline writes
      description: |
        The write half of offline support. The client replays its local queue in
        submission order. Each operation carries its own `op_id`, which is the
        idempotency key that was generated when the user acted — so replaying
        the whole batch after a partial failure is safe.

        Operations are applied in order and independently: a failure at index 3
        does not roll back indices 0-2, and the response reports per-operation
        status so the client knows exactly which entries to drop from its queue
        and which to surface to the user.

        Only the operations listed in `SyncOperation.path` are permitted here.
        This endpoint is not a generic tunnel to the whole API.
      operationId: postSyncBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/SyncOperation'
      responses:
        '207':
          description: Per-operation results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncOperationResult'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ----------------------------------------------------------------------
  # System
  # ----------------------------------------------------------------------

  /realtime/token:
    post:
      tags: [system]
      summary: Mint a short-lived ticket for the WebSocket handshake
      description: |
        Valid for 60 seconds, single use. Required because the browser
        WebSocket API cannot attach an Authorization header.
      operationId: createRealtimeToken
      responses:
        '201':
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_at, url]
                properties:
                  ticket: { type: string }
                  expires_at: { type: string, format: date-time }
                  url: { type: string, format: uri }

  /health:
    get:
      tags: [system]
      summary: Liveness and dependency health
      description: Unauthenticated. Used by orchestration and uptime monitoring.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  dependencies:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [ok, degraded, down]
        '503':
          description: Unhealthy

  # ----------------------------------------------------------------------
  # Payment
  # ----------------------------------------------------------------------

  /payments/intents:
    post:
      tags: [payment]
      summary: Create a payment intent
      description: |
        One intent per payable thing — a consultation fee, a pharmacy
        purchase, an insurance co-payment. For mobile money the response
        carries whatever the provider needs the client to show the payer (a
        USSD push confirmation, a reference code); the intent then settles
        asynchronously as the provider calls the webhook below.

        Cash and card-on-file settle synchronously and return `succeeded`
        immediately; mobile money almost never does.
      operationId: createPaymentIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, method, purpose]
              properties:
                amount: { type: number, minimum: 1 }
                currency:
                  type: string
                  default: TZS
                method: { $ref: '#/components/schemas/PaymentMethod' }
                purpose: { $ref: '#/components/schemas/PaymentPurpose' }
                consultation_id: { type: string, format: uuid }
                dispensing_id: { type: string, format: uuid }
                insurance_claim_id: { type: string, format: uuid }
                payer_phone:
                  $ref: '#/components/schemas/PhoneNumber'
                  description: Required for mobile money; the number the provider prompt is sent to.
                return_url: { type: string, format: uri }
      responses:
        '201':
          description: Intent created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /payments/intents/{payment_intent_id}:
    get:
      tags: [payment]
      summary: Get a payment intent
      description: |
        Poll this while a mobile money intent is `processing`. The webhook is
        what actually resolves it; this is what the client checks in the
        meantime, since a USSD push confirmation is not itself proof of
        settlement.
      operationId: getPaymentIntent
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
      responses:
        '200':
          description: Payment intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/intents/{payment_intent_id}/cancel:
    post:
      tags: [payment]
      summary: Cancel a payment intent before it settles
      description: |
        Only legal while `pending` or `requires_action`. Once a provider has
        reported success there is nothing left to cancel — that is a refund.
      operationId: cancelPaymentIntent
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/{payment_id}/refund:
    post:
      tags: [payment]
      summary: Refund a settled payment, in full or in part
      description: |
        Admin or facility-finance action. A partial refund may be issued more
        than once against the same payment as long as the running total does
        not exceed what was originally paid.
      operationId: refundPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amount:
                  type: number
                  description: Omit to refund the full remaining amount.
                reason: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Refund recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRefund' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /payments:
    get:
      tags: [payment]
      summary: List payments
      operationId: listPayments
      parameters:
        - name: consultation_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /payments/webhooks/{provider}:
    post:
      tags: [payment]
      summary: Provider settlement callback
      description: |
        Called by the mobile money provider, not by any client of this API.
        Authenticated by a provider-specific signature header rather than a
        bearer token — the provider does not have one. Idempotent by the
        provider's own transaction reference: replays of the same callback
        (providers retry aggressively) must resolve to the same outcome
        without double-crediting anything.
      operationId: handlePaymentWebhook
      security:
        - webhookSignature: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PaymentProvider' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Provider-specific payload; shape varies by provider.
      responses:
        '200':
          description: Acknowledged
        '401': { $ref: '#/components/responses/Unauthenticated' }
components:

  securitySchemes:
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: |
        HMAC of the raw request body using the shared per-provider secret.
        Used only on /payments/webhooks/*, paired with a source-IP allow-list
        where the provider publishes one.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gatewaySignature:
      type: apiKey
      in: header
      name: X-Gateway-Signature
      description: |
        HMAC of the raw request body using the shared aggregator secret.
        Used only on `/gateway/*`. Paired with a source-IP allow-list.

  parameters:
    PaymentIntentId:
      name: payment_intent_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID, created at the moment the user acted. Reused
        unchanged across every retry of the same intent. The server replays the
        original response for 24 hours.
      schema:
        type: string
        format: uuid
    ConsultationId:
      name: consultation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CareThreadId:
      name: care_thread_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClinicianId:
      name: clinician_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FollowUpCycleId:
      name: follow_up_cycle_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CheckInId:
      name: check_in_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PrescriptionId:
      name: prescription_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdherenceLogId:
      name: adherence_log_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PatientProfileId:
      name: patient_profile_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FacilityId:
      name: facility_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmergencyId:
      name: emergency_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitId:
      name: unit_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DispensingId:
      name: dispensing_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DiscussionId:
      name: discussion_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FamilyId:
      name: family_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueryId:
      name: query_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `meta.next_cursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Missing, expired, or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource does not exist or is not visible to the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: State conflict or version mismatch
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableEntity:
      description: Well-formed but semantically invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:

    PatientAuditHistory:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [event_type, occurred_at]
            properties:
              event_type:
                type: string
                enum: [consent.granted, consent.revoked, emergency.context_break_glass_access]
              occurred_at: { type: string, format: date-time }
              scope: { type: string }
              grantee_type: { type: string }

    AdminAuditLedgerPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [seq, category, event_type, resource_type, occurred_at, details]
            properties:
              seq: { type: string, pattern: '^[1-9][0-9]*$' }
              category: { type: string, enum: [consent, verification, break_glass] }
              event_type: { type: string }
              actor_id: { type: [string, 'null'], format: uuid }
              resource_type: { type: string }
              resource_id: { type: [string, 'null'], format: uuid }
              occurred_at: { type: string, format: date-time }
              details:
                type: object
                additionalProperties: { type: string }
        meta:
          type: object
          required: [next_cursor, has_more]
          properties:
            next_cursor: { type: [string, 'null'] }
            has_more: { type: boolean }

    AuditLedgerVerification:
      type: object
      required: [status, events_checked]
      properties:
        status: { type: string, enum: [VALID, INVALID] }
        events_checked: { type: integer, minimum: 0 }
        broken_at_seq: { type: string, pattern: '^[1-9][0-9]*$' }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable, already localised to the caller's `Accept-Language`.
            field:
              type: string
              description: Present on validation errors, naming the offending field.
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
              description: Echoes `X-Request-ID`. Quote this when reporting a problem.

    ErrorCode:
      type: string
      description: |
        Closed catalogue. Clients branch on `code`, never on `message`.
        Adding a code is a non-breaking change; removing or repurposing one is
        breaking and requires a new API version.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - TOKEN_REUSE_DETECTED
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_ATTEMPTS_EXCEEDED
        - FORBIDDEN
        - ROLE_NOT_PERMITTED
        - NOT_RESOURCE_OWNER
        - NOT_FOUND
        - IDEMPOTENCY_KEY_CONFLICT
        - VERSION_CONFLICT
        - STATE_TRANSITION_INVALID
        - CLINICIAN_NOT_VERIFIED
        - CLINICIAN_UNAVAILABLE
        - CONSULTATION_ALREADY_ASSIGNED
        - CARE_THREAD_CLOSED
        - SLOT_UNAVAILABLE
        - SLOT_IN_PAST
        - APPOINTMENT_NOT_YET_STARTABLE
        - APPOINTMENT_ALREADY_STARTED
        - CHECK_IN_ALREADY_ANSWERED
        - FOLLOW_UP_CYCLE_CLOSED
        - PRESCRIPTION_NOT_ACTIVE
        - CONSENT_REQUIRED
        - DEVICE_REVOKED
        - DISPENSE_CODE_INVALID
        - DISPENSE_CODE_EXPIRED
        - RESULT_ALREADY_ACKNOWLEDGED
        - ETHICS_APPROVAL_REQUIRED
        - AGGREGATE_TOO_SMALL
        - FACILITY_NOT_INTEGRATED
        - ALREADY_RATED
        - PAYMENT_METHOD_UNAVAILABLE
        - PAYMENT_ALREADY_SETTLED
        - REFUND_EXCEEDS_PAYMENT
        - PAYER_PHONE_REQUIRED
        - DUPLICATE_RESOURCE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE

    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    CursorMeta:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: [string, 'null']
        has_more: { type: boolean }

    SyncMeta:
      type: object
      required: [next_cursor, has_more, server_time]
      properties:
        next_cursor: { type: string }
        has_more: { type: boolean }
        server_time:
          type: string
          format: date-time
          description: Authoritative clock. Clients with skewed device time should offset against this.

    PhoneNumber:
      type: string
      description: E.164 format, including country code.
      pattern: '^\+[1-9][0-9]{7,14}$'
      examples: ['+255712345678']

    LanguageCode:
      type: string
      description: ISO 639-1.
      enum: [sw, en, fr, ha, am]

    Channel:
      type: string
      enum: [app, sms, ussd, voice, web]

    Sex:
      type: string
      enum: [male, female, other]

    Specialty:
      type: string
      enum:
        - general_practice
        - internal_medicine
        - paediatrics
        - obstetrics_gynaecology
        - surgery
        - oncology
        - psychiatry
        - dermatology
        - other

    UrgencyLevel:
      type: string
      description: |
        Determines the SLA window: emergency 3 minutes, urgent 15 minutes,
        routine 2 hours. Values are configurable per deployment without a code
        release, but the enum itself is fixed.
      enum: [routine, urgent, emergency]

    ConsultationStatus:
      type: string
      enum: [pending, offered, matched, in_progress, completed, escalated, cancelled]

    CareThreadStatus:
      type: string
      enum: [open, closed]

    AppointmentStatus:
      type: string
      enum: [booked, started, completed, cancelled, no_show]

    ConsultationModality:
      type: string
      description: |
        `async` is store-and-forward — the clinician answers when able, without
        both parties being online. It is the default for low-bandwidth areas and
        the only modality guaranteed to work over SMS and USSD.
      enum: [chat, voice, video, async]

    AdherenceStatus:
      type: string
      enum: [taken, missed, delayed, unreported]

    UserRole:
      type: string
      enum: [patient, clinician, dispatcher, facility_admin, platform_admin]

    UserStatus:
      type: string
      enum: [active, suspended, pending_verification, deactivated]

    VerificationStatus:
      type: string
      enum: [pending, verified, rejected]

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        accuracy_metres: { type: number }

    OtpChallenge:
      type: object
      required: [challenge_id, expires_at, delivery_channel]
      properties:
        challenge_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        delivery_channel:
          $ref: '#/components/schemas/Channel'
        masked_destination:
          type: string
          description: Partially redacted destination, e.g. `+2557****5678`.
          examples: ['+2557****5678']

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          examples: [900]
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, role, status, preferred_language, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        full_name: { type: string }
        phone_number:
          $ref: '#/components/schemas/PhoneNumber'
        email: { type: [string, 'null'], format: email }
        preferred_language:
          $ref: '#/components/schemas/LanguageCode'
        patient_profile:
          $ref: '#/components/schemas/PatientProfile'
        clinician_profile:
          $ref: '#/components/schemas/ClinicianProfile'
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PatientProfile:
      type: object
      required: [id, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: [string, 'null'], format: uuid }
        guardian_user_id:
          type: [string, 'null']
          format: uuid
          description: Set for dependant profiles that have no login of their own.
        full_name: { type: string }
        date_of_birth: { type: string, format: date }
        sex:
          $ref: '#/components/schemas/Sex'
        chronic_conditions:
          type: array
          items: { type: string }
        allergies:
          type: array
          items: { type: string }
        blood_type: { type: [string, 'null'] }
        default_location:
          $ref: '#/components/schemas/GeoPoint'
        region_code:
          type: string
          description: Used for de-identified aggregation. Never returned in analytics views alongside an id.
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    ClinicianProfile:
      type: object
      required: [id, verification_status, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        facility_id: { type: [string, 'null'], format: uuid }
        license_number: { type: string }
        specialty:
          $ref: '#/components/schemas/Specialty'
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        rejection_reason: { type: [string, 'null'] }
        languages_spoken:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCode'
        is_available: { type: boolean }
        available_until: { type: [string, 'null'], format: date-time }
        current_load:
          type: integer
          description: Count of consultations currently in progress. Read-only.
        rating_avg: { type: [number, 'null'], format: float }
        full_name: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        account_status: { type: string }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    ClinicianDirectoryEntry:
      type: object
      required: [id, full_name, specialty, status, queue_count]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: [string, 'null'] }
        specialty: { $ref: '#/components/schemas/Specialty' }
        status: { type: string, enum: [available, busy, off_duty] }
        queue_count: { type: integer }
        license_number:
          type: string
          description: Returned to platform_admin only.
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        facility_id: { type: [string, 'null'], format: uuid }
        is_available: { type: boolean }

    CareThread:
      type: object
      required: [id, patient_profile_id, status, opened_at, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        patient_profile_id: { type: string, format: uuid }
        primary_clinician_id: { type: [string, 'null'], format: uuid }
        status:
          $ref: '#/components/schemas/CareThreadStatus'
        reason_summary:
          type: string
          description: Short clinician-authored label for the problem this thread tracks.
        latest_consultation_id: { type: [string, 'null'], format: uuid }
        open_consultation_count: { type: integer }
        active_follow_up_cycle_id: { type: [string, 'null'], format: uuid }
        opened_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        outcome:
          type: [string, 'null']
          enum: [recovered, referred_out, lost_to_follow_up, deceased, null]
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    CareThreadDetail:
      allOf:
        - $ref: '#/components/schemas/CareThread'
        - type: object
          properties:
            patient:
              $ref: '#/components/schemas/PatientProfile'
            timeline:
              type: array
              description: Chronological, oldest first.
              items:
                $ref: '#/components/schemas/TimelineEntry'

    TimelineEntry:
      type: object
      required: [entry_type, occurred_at, id]
      properties:
        entry_type:
          type: string
          enum: [consultation, note, prescription, check_in, deviation, referral, thread_closed]
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { type: [string, 'null'], format: uuid }
        summary: { type: string }
        payload:
          type: object
          additionalProperties: true

    StructuredSymptom:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Platform symptom code consumed by the triage rules engine.
          examples: ['chest_pain']
        severity:
          type: integer
          minimum: 0
          maximum: 10
        duration_hours: { type: number }

    ConsultationRequest:
      type: object
      required: [id, care_thread_id, patient_profile_id, status, urgency_level, channel, created_at, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        care_thread_id: { type: string, format: uuid }
        patient_profile_id: { type: string, format: uuid }
        assigned_clinician_id: { type: [string, 'null'], format: uuid }
        referred_from_consultation_id: { type: [string, 'null'], format: uuid }
        appointment_id:
          type: [string, 'null']
          format: uuid
          description: Set when this consultation came from a booked appointment rather than the queue.
        modality:
          $ref: '#/components/schemas/ConsultationModality'
        queue_position:
          type: [integer, 'null']
          description: Position while `pending` or `offered`. Null once assigned.
        estimated_wait_minutes:
          type: [integer, 'null']
          description: Forecast, not a commitment. Null when no reliable estimate exists.
        channel:
          $ref: '#/components/schemas/Channel'
        symptom_text: { type: [string, 'null'] }
        structured_symptoms:
          type: array
          items:
            $ref: '#/components/schemas/StructuredSymptom'
        voice_note_key: { type: [string, 'null'] }
        urgency_level:
          $ref: '#/components/schemas/UrgencyLevel'
        triage_rule_version:
          type: string
          description: |
            Exact version of the rule set that produced `urgency_level`. Stored
            for clinical audit — a triage decision must always be explainable
            against the rules that were live at the time.
        status:
          $ref: '#/components/schemas/ConsultationStatus'
        sla_deadline_at: { type: string, format: date-time }
        escalation_count: { type: integer }
        created_at: { type: string, format: date-time }
        client_created_at: { type: [string, 'null'], format: date-time }
        accepted_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    TriageRuleset:
      type: object
      required: [id, label, status, rules, sla_seconds, created_at]
      properties:
        id: { type: string, format: uuid }
        label:
          type: string
          description: Written onto every consultation this ruleset judges.
        status:
          type: string
          enum: [draft, active, retired]
        rules:
          type: object
          additionalProperties: true
          description: Red flags, urgent codes, specialty hints, age thresholds, chronic modifiers.
        sla_seconds:
          type: object
          description: How long each urgency level may wait, versioned with the rules so a stamp explains both.
          properties:
            emergency: { type: integer }
            urgent: { type: integer }
            routine: { type: integer }
        notes: { type: [string, 'null'] }
        created_by_id: { type: string, format: uuid }
        activated_at: { type: [string, 'null'], format: date-time }
        retired_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    QueueEntry:
      type: object
      required: [consultation, offered_at]
      properties:
        consultation:
          $ref: '#/components/schemas/ConsultationRequest'
        patient_summary:
          type: object
          description: |
            Minimum necessary to decide whether to accept — age band, sex,
            language, flagged chronic conditions. Full history is only readable
            after acceptance.
          properties:
            age_band: { type: string, examples: ['30-39'] }
            sex:
              $ref: '#/components/schemas/Sex'
            preferred_language:
              $ref: '#/components/schemas/LanguageCode'
            has_chronic_conditions: { type: boolean }
        offered_at: { type: string, format: date-time }
        offer:
          type: object
          description: Present for the clinician's actionable offer queue. Expired offers are omitted from that queue.
          required: [state, expires_at]
          properties:
            state: { type: string, enum: [offered] }
            expires_at: { type: string, format: date-time }
        seconds_to_sla_breach: { type: integer }
        rank_score: { type: number, format: float }

    Message:
      type: object
      required: [id, care_thread_id, sender_user_id, created_at, version]
      properties:
        id: { type: string, format: uuid }
        care_thread_id: { type: string, format: uuid }
        consultation_id:
          type: [string, 'null']
          format: uuid
          description: |
            Which consultation was open when this was sent. Null for messages
            exchanged between consultations — during follow-up, for example.
        sender_user_id: { type: string, format: uuid }
        body: { type: [string, 'null'] }
        attachment_key: { type: [string, 'null'] }
        attachment_type:
          type: [string, 'null']
          enum: [voice_note, image, document, null]
        delivered_via:
          $ref: '#/components/schemas/Channel'
        created_at: { type: string, format: date-time }
        client_created_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }

    Slot:
      type: object
      required: [id, clinician_id, starts_at, duration_minutes, is_booked]
      properties:
        id: { type: string, format: uuid }
        clinician_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        duration_minutes: { type: integer }
        modality:
          $ref: '#/components/schemas/ConsultationModality'
        is_booked: { type: boolean }

    Appointment:
      type: object
      required: [id, slot_id, patient_profile_id, clinician_id, starts_at, status, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        slot_id: { type: string, format: uuid }
        care_thread_id: { type: [string, 'null'], format: uuid }
        patient_profile_id: { type: string, format: uuid }
        clinician_id: { type: string, format: uuid }
        consultation_id:
          type: [string, 'null']
          format: uuid
          description: Set once the appointment has been started.
        starts_at: { type: string, format: date-time }
        duration_minutes: { type: integer }
        modality:
          $ref: '#/components/schemas/ConsultationModality'
        reason: { type: [string, 'null'] }
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        cancelled_reason: { type: [string, 'null'] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    QueueStatus:
      type: object
      required: [consultation_id, status, urgency_level]
      properties:
        consultation_id: { type: string, format: uuid }
        status:
          $ref: '#/components/schemas/ConsultationStatus'
        urgency_level:
          $ref: '#/components/schemas/UrgencyLevel'
        queue_position: { type: [integer, 'null'] }
        ahead_of_you: { type: [integer, 'null'] }
        estimated_wait_minutes: { type: [integer, 'null'] }
        sla_deadline_at: { type: string, format: date-time }
        assigned_clinician_id: { type: [string, 'null'], format: uuid }
        assigned_clinician:
          type: [object, 'null']
          description: Present once assigned. Deliberately minimal.
          properties:
            full_name: { type: string }
            specialty:
              $ref: '#/components/schemas/Specialty'

    ConsultationNote:
      type: object
      required: [id, consultation_id, care_thread_id, signed_by_clinician_id, signed_at, version]
      properties:
        id: { type: string, format: uuid }
        consultation_id: { type: string, format: uuid }
        care_thread_id: { type: string, format: uuid }
        diagnosis_text: { type: string }
        diagnosis_codes:
          type: array
          items: { type: string }
        advice_text: { type: string }
        red_flags_discussed:
          type: array
          items: { type: string }
        referred_specialist_id: { type: [string, 'null'], format: uuid }
        signed_by_clinician_id: { type: string, format: uuid }
        signed_at: { type: string, format: date-time }
        version: { type: integer }

    FollowUpCycle:
      type: object
      required: [id, care_thread_id, patient_profile_id, clinician_id, status, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        care_thread_id: { type: string, format: uuid }
        patient_profile_id: { type: string, format: uuid }
        clinician_id: { type: string, format: uuid }
        source_consultation_id: { type: string, format: uuid }
        frequency:
          type: string
          enum: [daily, twice_daily, weekly, custom]
        custom_cron: { type: [string, 'null'] }
        questionnaire_key: { type: [string, 'null'] }
        recovery_criteria:
          type: object
          additionalProperties: true
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status:
          type: string
          enum: [active, completed, cancelled]
        outcome:
          type: [string, 'null']
          enum: [recovered, escalated, lost_to_follow_up, null]
        open_deviation_count: { type: integer }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    CheckIn:
      type: object
      required: [id, follow_up_cycle_id, scheduled_at, status, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        follow_up_cycle_id: { type: string, format: uuid }
        care_thread_id: { type: string, format: uuid }
        scheduled_at: { type: string, format: date-time }
        status:
          type: string
          enum: [scheduled, responded, missed]
        questions:
          type: array
          description: Rendered question set, cached by the client for offline answering.
          items:
            type: object
            additionalProperties: true
        responses:
          type: [object, 'null']
          additionalProperties: true
        is_deviation:
          type: boolean
          description: Computed server-side against `recovery_criteria`. Never client-supplied.
        deviation_reasons:
          type: array
          items: { type: string }
        reviewed_by_id: { type: [string, 'null'], format: uuid }
        reviewed_at: { type: [string, 'null'], format: date-time }
        responded_at: { type: [string, 'null'], format: date-time }
        channel:
          $ref: '#/components/schemas/Channel'
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    Prescription:
      type: object
      required: [id, care_thread_id, patient_profile_id, prescribed_by_id, status, items, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        care_thread_id: { type: string, format: uuid }
        consultation_id: { type: string, format: uuid }
        patient_profile_id: { type: string, format: uuid }
        prescribed_by_id: { type: string, format: uuid }
        status:
          type: string
          enum: [active, completed, discontinued]
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionItem'
        adherence_rate:
          type: [number, 'null']
          format: float
          description: Confirmed doses over expected doses to date, 0-1.
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PrescriptionItem:
      type: object
      required: [id, medication_name, dosage, frequency_per_day, duration_days]
      properties:
        id: { type: string, format: uuid }
        medication_name: { type: string }
        dosage: { type: string }
        frequency_per_day: { type: integer }
        duration_days: { type: integer }
        instructions: { type: [string, 'null'] }

    AdherenceLog:
      type: object
      required: [id, prescription_item_id, scheduled_at, reported_status, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        prescription_item_id: { type: string, format: uuid }
        prescription_id: { type: string, format: uuid }
        patient_profile_id: { type: string, format: uuid }
        medication_name:
          type: string
          description: Denormalised so a reminder can render without a second fetch.
        dosage: { type: string }
        scheduled_at: { type: string, format: date-time }
        reported_status:
          $ref: '#/components/schemas/AdherenceStatus'
        reported_at: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        channel:
          $ref: '#/components/schemas/Channel'
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    ConsultationNoteInput:
      type: object
      required: [diagnosis_text, advice_text]
      properties:
        diagnosis_text:
          type: string
          maxLength: 4000
        diagnosis_codes:
          type: array
          description: ICD-10 codes where the clinician can supply them.
          items: { type: string }
        advice_text:
          type: string
          maxLength: 4000
        red_flags_discussed:
          type: array
          description: Warning signs the patient was told to watch for.
          items: { type: string }

    PrescriptionInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [medication_name, dosage, frequency_per_day, duration_days]
            properties:
              medication_name: { type: string, maxLength: 150 }
              dosage: { type: string, examples: ['500mg'] }
              frequency_per_day: { type: integer, minimum: 1, maximum: 12 }
              duration_days: { type: integer, minimum: 1, maximum: 365 }
              instructions: { type: string }

    FollowUpCycleInput:
      type: object
      required: [frequency, duration_days]
      properties:
        frequency:
          type: string
          enum: [daily, twice_daily, weekly, custom]
        custom_cron:
          type: string
          description: Required when `frequency` is `custom`.
        duration_days: { type: integer, minimum: 1, maximum: 365 }
        questionnaire_key:
          type: string
          description: Which check-in questionnaire to send at each interval.
        recovery_criteria:
          type: object
          description: |
            Clinician-set thresholds. A check-in response outside these bounds
            is flagged `is_deviation` and raises a high-priority review task.
          additionalProperties: true

    ConsultationCompletionResult:
      type: object
      required: [consultation, note]
      properties:
        consultation:
          $ref: '#/components/schemas/ConsultationRequest'
        note:
          type: object
          properties:
            id: { type: string, format: uuid }
            signed_by_clinician_id: { type: string, format: uuid }
            signed_at: { type: string, format: date-time }
        prescription_id: { type: [string, 'null'], format: uuid }
        follow_up_cycle_id: { type: [string, 'null'], format: uuid }
        care_thread:
          $ref: '#/components/schemas/CareThread'

    SyncEntity:
      type: string
      enum:
        - care_threads
        - appointments
        - consultation_requests
        - consultation_notes
        - messages
        - prescriptions
        - prescription_items
        - adherence_logs
        - follow_up_cycles
        - check_ins
        - screening_invitations
        - vaccinations
        - investigation_orders
        - devices
        - families
        - payment_intents
        - patient_profiles

    SyncChange:
      type: object
      required: [entity, id, op, version, updated_at]
      properties:
        entity:
          $ref: '#/components/schemas/SyncEntity'
        id: { type: string, format: uuid }
        op:
          type: string
          enum: [create, update, delete]
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        data:
          type: object
          description: Full resource body. Absent when `op` is `delete`.
          additionalProperties: true

    SyncOperation:
      type: object
      required: [op_id, method, path]
      properties:
        op_id:
          type: string
          format: uuid
          description: Generated when the user acted. Doubles as the idempotency key.
        method:
          type: string
          enum: [POST, PATCH]
        path:
          type: string
          description: |
            Relative path of the operation being replayed. Restricted to the
            whitelist of offline-capable writes — every entry here is a path
            defined elsewhere in this document.
          enum:
            - /consultations
            - /care-threads/{care_thread_id}/messages
            - /consultations/{consultation_id}/complete
            - /check-ins/{check_in_id}/respond
            - /adherence-logs/{adherence_log_id}/confirm
            - /appointments
            - /appointments/{appointment_id}/cancel
        path_params:
          type: object
          additionalProperties: { type: string }
        base_version:
          type: integer
          description: Version the client believed it was writing against, where applicable.
        body:
          type: object
          additionalProperties: true
        client_created_at: { type: string, format: date-time }

    SyncOperationResult:
      type: object
      required: [op_id, status]
      properties:
        op_id: { type: string, format: uuid }
        status:
          type: integer
          description: The HTTP status the operation would have returned individually.
        body:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
    FacilityType:
      type: string
      enum: [hospital, clinic, pharmacy, laboratory, transport_partner]

    IntegrationLevel:
      type: string
      description: |
        How deeply a facility is connected. `none` is honest and common —
        a facility with no integration reports no queue rather than a guess.
      enum: [none, partial, full, platform_operated]

    Facility:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/FacilityType' }
        integration_level: { $ref: '#/components/schemas/IntegrationLevel' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        region_code: { type: [string, 'null'] }
        contact_phone: { type: [string, 'null'] }
        distance_km: { type: [number, 'null'] }
        is_active: { type: boolean }

    Department:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid }
        name: { type: string }
        specialty: { $ref: '#/components/schemas/Specialty' }

    ProviderAvailability:
      type: object
      required: [clinician_id, full_name, status]
      properties:
        clinician_id: { type: string, format: uuid }
        full_name: { type: string }
        specialty: { $ref: '#/components/schemas/Specialty' }
        status:
          type: string
          enum: [available, busy, away, off_duty]
        queue_length: { type: integer }
        estimated_wait_minutes: { type: [integer, 'null'] }
        next_free_at: { type: [string, 'null'], format: date-time }

    FacilityQueue:
      type: object
      required: [facility_id, integration_level, providers]
      properties:
        facility_id: { type: string, format: uuid }
        integration_level: { $ref: '#/components/schemas/IntegrationLevel' }
        department_id: { type: [string, 'null'], format: uuid }
        observed_at: { type: string, format: date-time }
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderAvailability' }

    AiAudience:
      type: string
      description: Patient-facing answers explain; clinician-facing answers cite.
      enum: [patient, clinician]

    AiConversation:
      type: object
      required: [id, audience, created_at]
      properties:
        id: { type: string, format: uuid }
        audience: { $ref: '#/components/schemas/AiAudience' }
        care_thread_id: { type: [string, 'null'], format: uuid }
        patient_profile_id: { type: [string, 'null'], format: uuid }
        language: { $ref: '#/components/schemas/LanguageCode' }
        model_version: { type: string }
        created_at: { type: string, format: date-time }

    AiConversationDetail:
      allOf:
        - $ref: '#/components/schemas/AiConversation'
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/AiReply' }

    Citation:
      type: object
      required: [source, title]
      properties:
        source: { type: string, description: Approved guideline or knowledge-base identifier. }
        title: { type: string }
        section: { type: [string, 'null'] }

    AiReply:
      type: object
      required: [id, role, body, created_at]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [user, assistant]
        body: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        escalated:
          type: boolean
          description: |
            True when a red flag was recognised. The client must surface the
            urgent-care instruction instead of continuing the conversation.
        escalation_reason: { type: [string, 'null'] }
        navigation_action:
          oneOf:
            - $ref: '#/components/schemas/AiNavigationAction'
            - type: 'null'
          description: Optional suggestion only; the client must reject unknown values and require a patient tap.
        model_version: { type: string }
        created_at: { type: string, format: date-time }

    AiNavigationAction:
      type: string
      description: Allowlisted Patient app destinations. UNSUPPORTED_TEST_ACTION is emitted only by the local stub test fixture and must be ignored by clients.
      enum:
        - OPEN_DOCTORS
        - START_CONSULTATION
        - OPEN_APPOINTMENTS
        - OPEN_DIAGNOSTICS
        - OPEN_MEDICATIONS
        - OPEN_PHARMACY
        - OPEN_FAMILY
        - OPEN_EDUCATION
        - OPEN_PREVENTION
        - OPEN_EMERGENCY
        - OPEN_PRIVACY
        - OPEN_FEEDBACK
        - OPEN_INSURANCE_PAYMENTS
        - UNSUPPORTED_TEST_ACTION

    TriageSuggestion:
      type: object
      required: [suggested_urgency, confidence, model_version]
      properties:
        suggested_urgency: { $ref: '#/components/schemas/UrgencyLevel' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        red_flags:
          type: array
          items: { type: string }
        recommended_department: { type: [string, 'null'] }
        rationale: { type: string }
        model_version: { type: string }
        advisory_only:
          type: boolean
          description: Always true. Present so no client can mistake this for a decision.

    DrugInteractionFinding:
      type: object
      required: [medications, severity, description]
      properties:
        medications:
          type: array
          items: { type: string }
        severity:
          type: string
          enum: [minor, moderate, major, contraindicated]
        description: { type: string }
        source: { type: string }

    DrugInteractionReport:
      type: object
      required: [findings, model_version]
      properties:
        findings:
          type: array
          items: { $ref: '#/components/schemas/DrugInteractionFinding' }
        model_version: { type: string }

    Transcript:
      type: object
      required: [text, confidence, language]
      properties:
        text: { type: string }
        confidence:
          type: number
          description: |
            Low-confidence output must be shown to the speaker for correction
            rather than filed silently, which matters most for Swahili.
        language: { $ref: '#/components/schemas/LanguageCode' }
        model_version: { type: string }

    AiModel:
      type: object
      required: [key, function, status]
      properties:
        key: { type: string, examples: ['llama-3.1', 'medgemma', 'whisper'] }
        function: { type: string }
        version: { type: string }
        status:
          type: string
          enum: [active, shadow, retired, not_deployed]
        last_validated_at: { type: [string, 'null'], format: date-time }
        accuracy_summary: { type: [string, 'null'] }
        bias_review_at: { type: [string, 'null'], format: date-time }
        governance_notes: { type: [string, 'null'] }

    EmergencyScale:
      type: string
      enum: [individual, mass_casualty]

    EmergencyCategory:
      type: string
      enum: [medical, trauma, obstetric, road_traffic, fire, other]

    EmergencySource:
      type: string
      enum: [patient_app, bystander, ussd, sms, voice, wearable, vehicle_sensor, facility]

    EmergencyStatus:
      type: string
      enum: [reported, triaged, dispatched, en_route, arrived, resolved, cancelled]

    EmergencyOutcome:
      type: string
      enum: [transported, treated_on_scene, refused_care, false_alarm, deceased]

    EmergencyRequest:
      type: object
      required: [id, scale, status, reported_at, version]
      properties:
        id: { type: string, format: uuid }
        scale: { $ref: '#/components/schemas/EmergencyScale' }
        category: { $ref: '#/components/schemas/EmergencyCategory' }
        source: { $ref: '#/components/schemas/EmergencySource' }
        status: { $ref: '#/components/schemas/EmergencyStatus' }
        outcome: { type: [string, 'null'] }
        location: { $ref: '#/components/schemas/GeoPoint' }
        patient_profile_id: { type: [string, 'null'], format: uuid }
        estimated_casualties: { type: [integer, 'null'] }
        description: { type: [string, 'null'] }
        transport_unit_id: { type: [string, 'null'], format: uuid }
        destination_facility_id: { type: [string, 'null'], format: uuid }
        reported_at: { type: string, format: date-time }
        dispatched_at: { type: [string, 'null'], format: date-time }
        arrived_at: { type: [string, 'null'], format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }

    TransportStatus:
      type: string
      enum: [available, dispatched, en_route, at_scene, transporting, out_of_service]

    TransportUnit:
      type: object
      required: [id, call_sign, status]
      properties:
        id: { type: string, format: uuid }
        call_sign: { type: string }
        facility_id: { type: [string, 'null'], format: uuid }
        capability:
          type: string
          enum: [basic, advanced, neonatal, mass_casualty]
        status: { $ref: '#/components/schemas/TransportStatus' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        distance_km: { type: [number, 'null'] }
        location_updated_at: { type: [string, 'null'], format: date-time }

    DeviceType:
      type: string
      enum: [wearable_watch, vehicle_sensor, bp_monitor, glucometer, pulse_oximeter]

    DeviceAlertType:
      type: string
      enum: [fall_detected, collision_detected, heart_rate_abnormal, spo2_low, no_motion, manual_trigger]

    Device:
      type: object
      required: [id, device_type, serial_number, status]
      properties:
        id: { type: string, format: uuid }
        device_type: { $ref: '#/components/schemas/DeviceType' }
        serial_number: { type: string }
        patient_profile_id: { type: [string, 'null'], format: uuid }
        vehicle_registration: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        status:
          type: string
          enum: [active, revoked, lost]
        last_seen_at: { type: [string, 'null'], format: date-time }
        battery_percent: { type: [integer, 'null'] }

    DeviceRegistration:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            device_credential:
              type: string
              description: Returned once, never again. Re-register if it is lost.

    TelemetryReading:
      type: object
      required: [metric, value, recorded_at]
      properties:
        metric:
          type: string
          enum: [heart_rate, spo2, systolic, diastolic, glucose, temperature, steps, motion, impact_g]
        value: { type: number }
        unit: { type: [string, 'null'] }
        recorded_at:
          type: string
          format: date-time
          description: The device's own clock. Arrival order carries no meaning.

    DeviceAlert:
      type: object
      required: [id, device_id, alert_type, detected_at, status]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        alert_type: { $ref: '#/components/schemas/DeviceAlertType' }
        detected_at: { type: string, format: date-time }
        confidence: { type: [number, 'null'] }
        location: { $ref: '#/components/schemas/GeoPoint' }
        emergency_request_id: { type: [string, 'null'], format: uuid }
        notified:
          type: array
          description: Who was reached, and how.
          items:
            type: object
            properties:
              recipient_type:
                type: string
                enum: [treating_clinician, family_doctor, emergency_department, relative, patient]
              channel: { $ref: '#/components/schemas/Channel' }
              delivered: { type: boolean }
        status:
          type: string
          enum: [raised, acknowledged, escalated, false_positive, resolved]

    RiskScore:
      type: object
      required: [condition_code, score, band, model_version, computed_at]
      properties:
        condition_code: { type: string }
        score: { type: number, minimum: 0, maximum: 1 }
        band:
          type: string
          enum: [low, moderate, high, very_high]
        contributing_factors:
          type: array
          description: |
            The features that drove the score. A score nobody can interrogate
            cannot be acted on responsibly.
          items:
            type: object
            properties:
              factor: { type: string }
              contribution: { type: number }
        model_version: { type: string }
        computed_at: { type: string, format: date-time }
        advisory_only: { type: boolean }

    ScreeningProgramme:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        condition_code: { type: string }
        eligibility:
          type: object
          additionalProperties: true
        interval_months: { type: integer }
        is_active: { type: boolean }

    InvitationStatus:
      type: string
      enum: [pending, accepted, declined, deferred, completed, expired]

    ScreeningInvitation:
      type: object
      required: [id, programme_id, patient_profile_id, status, invited_at]
      properties:
        id: { type: string, format: uuid }
        programme_id: { type: string, format: uuid }
        patient_profile_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        decline_reason: { type: [string, 'null'] }
        appointment_id: { type: [string, 'null'], format: uuid }
        invited_at: { type: string, format: date-time }
        responded_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }

    Vaccination:
      type: object
      required: [id, vaccine_code, status]
      properties:
        id: { type: string, format: uuid }
        patient_profile_id: { type: string, format: uuid }
        vaccine_code: { type: string }
        dose_number: { type: integer }
        status:
          type: string
          enum: [due, overdue, administered, contraindicated]
        due_at: { type: [string, 'null'], format: date-time }
        administered_at: { type: [string, 'null'], format: date-time }
        facility_id: { type: [string, 'null'], format: uuid }
        batch_number: { type: [string, 'null'] }
        version: { type: integer }

    Pharmacy:
      type: object
      required: [id, name, is_verified]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        license_number: { type: string }
        is_verified:
          type: boolean
          description: Only verified, appropriately licensed pharmacies participate.
        location: { $ref: '#/components/schemas/GeoPoint' }
        distance_km: { type: [number, 'null'] }
        contact_phone: { type: [string, 'null'] }
        opening_hours: { type: [string, 'null'] }

    MedicationAvailability:
      type: object
      required: [pharmacy, medication_name, stock_status]
      properties:
        pharmacy: { $ref: '#/components/schemas/Pharmacy' }
        medication_name: { type: string }
        stock_status:
          type: string
          enum: [in_stock, low_stock, out_of_stock, unknown]
        unit_price: { type: [number, 'null'] }
        currency: { type: [string, 'null'] }
        last_reported_at:
          type: string
          format: date-time
          description: |
            Stock data ages fast. A stale figure sent someone on a journey for
            nothing, so the age is always visible.

    DispenseCode:
      type: object
      required: [code, expires_at, prescription_id]
      properties:
        code: { type: string }
        prescription_id: { type: string, format: uuid }
        pharmacy_id: { type: [string, 'null'], format: uuid }
        expires_at: { type: string, format: date-time }

    DispensingView:
      type: object
      description: |
        Deliberately narrow. A pharmacist needs the medication, the dose and
        the prescriber — not the diagnosis.
      required: [dispensing_id, items, prescribed_by]
      properties:
        dispensing_id: { type: string, format: uuid }
        prescription_id: { type: string, format: uuid }
        patient_display_name: { type: string }
        prescribed_by: { type: string }
        prescribed_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/PrescriptionItem' }

    DispensingRecord:
      type: object
      required: [id, status, dispensed_at]
      properties:
        id: { type: string, format: uuid }
        prescription_id: { type: string, format: uuid }
        pharmacy_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, partial, complete, cancelled]
        dispensed_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              prescription_item_id: { type: string, format: uuid }
              quantity_dispensed: { type: integer }
              substituted_with: { type: [string, 'null'] }
              substitution_approved_by: { type: [string, 'null'], format: uuid }
        version: { type: integer }

    InvestigationType:
      type: string
      enum: [laboratory, imaging, pathology, point_of_care]

    InvestigationStatus:
      type: string
      enum: [ordered, scheduled, collected, resulted, acknowledged, cancelled]

    ResultValue:
      type: object
      required: [analyte, value]
      properties:
        analyte: { type: string }
        value: { type: string }
        unit: { type: [string, 'null'] }
        reference_low: { type: [number, 'null'] }
        reference_high: { type: [number, 'null'] }
        flag:
          type: string
          enum: [normal, low, high, critical_low, critical_high]

    InvestigationOrder:
      type: object
      required: [id, care_thread_id, investigation_code, status, ordered_at, version]
      properties:
        id: { type: string, format: uuid }
        care_thread_id: { type: string, format: uuid }
        consultation_id: { type: [string, 'null'], format: uuid }
        patient_profile_id: { type: string, format: uuid }
        ordered_by_id: { type: string, format: uuid }
        facility_id: { type: [string, 'null'], format: uuid }
        investigation_code: { type: string }
        investigation_type: { $ref: '#/components/schemas/InvestigationType' }
        urgency: { $ref: '#/components/schemas/UrgencyLevel' }
        status: { $ref: '#/components/schemas/InvestigationStatus' }
        clinical_notes: { type: [string, 'null'] }
        values:
          type: array
          items: { $ref: '#/components/schemas/ResultValue' }
        narrative: { type: [string, 'null'] }
        attachment_key: { type: [string, 'null'] }
        is_critical:
          type: boolean
          description: |
            Set by the server from the reference bounds. A critical result
            escalates until a clinician acknowledges it; silence is never
            treated as receipt.
        acknowledged_by_id: { type: [string, 'null'], format: uuid }
        acknowledged_at: { type: [string, 'null'], format: date-time }
        ordered_at: { type: string, format: date-time }
        resulted_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }

    Community:
      type: object
      required: [id, name, specialty]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        specialty: { $ref: '#/components/schemas/Specialty' }
        member_count: { type: integer }
        description: { type: [string, 'null'] }

    Discussion:
      type: object
      required: [id, community_id, title, author_clinician_id, created_at]
      properties:
        id: { type: string, format: uuid }
        community_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        author_clinician_id: { type: string, format: uuid }
        is_case_discussion: { type: boolean }
        care_thread_id:
          type: [string, 'null']
          format: uuid
          description: Present for case discussions. De-identified on the way in.
        reply_count: { type: integer }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    DiscussionReply:
      type: object
      required: [id, discussion_id, body, author_clinician_id, created_at]
      properties:
        id: { type: string, format: uuid }
        discussion_id: { type: string, format: uuid }
        body: { type: string }
        author_clinician_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    SecondOpinion:
      type: object
      required: [id, care_thread_id, specialty, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        care_thread_id: { type: string, format: uuid }
        requested_by_id: { type: string, format: uuid }
        answered_by_id: { type: [string, 'null'], format: uuid }
        specialty: { $ref: '#/components/schemas/Specialty' }
        question: { type: string }
        answer: { type: [string, 'null'] }
        status:
          type: string
          enum: [open, claimed, answered, withdrawn]
        requested_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }

    ContentFormat:
      type: string
      enum: [article, audio, video, interactive, sms_series]

    EducationTopic:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        category:
          type: string
          enum: [communicable, non_communicable, maternal_child, mental_health, prevention, nutrition]
        article_count: { type: integer }

    EducationArticle:
      type: object
      required: [slug, title, language, format]
      properties:
        slug: { type: string }
        topic_slug: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: [string, 'null'] }
        media_key: { type: [string, 'null'] }
        language: { $ref: '#/components/schemas/LanguageCode' }
        format: { $ref: '#/components/schemas/ContentFormat' }
        reading_level:
          type: string
          enum: [basic, intermediate, advanced]
        myth_vs_fact:
          type: array
          description: Explicit misinformation counters, used where a myth is widespread.
          items:
            type: object
            properties:
              myth: { type: string }
              fact: { type: string }
        reviewed_by_id: { type: [string, 'null'], format: uuid }
        reviewed_at: { type: [string, 'null'], format: date-time }

    SubscriptionTier:
      type: string
      enum: [none, family_basic, family_plus]

    FamilyRelationship:
      type: string
      enum: [head, spouse, child, parent, sibling, dependant, other]

    Family:
      type: object
      required: [id, name, subscription_tier]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subscription_tier: { $ref: '#/components/schemas/SubscriptionTier' }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    FamilyMember:
      type: object
      required: [id, patient_profile_id, relationship]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        patient_profile_id: { type: string, format: uuid }
        full_name: { type: string }
        relationship: { $ref: '#/components/schemas/FamilyRelationship' }

    FamilyDetail:
      allOf:
        - $ref: '#/components/schemas/Family'
        - type: object
          properties:
            members:
              type: array
              items: { $ref: '#/components/schemas/FamilyMember' }
            gp_clinician:
              type: [object, 'null']
              properties:
                id: { type: string, format: uuid }
                full_name: { type: string }
                current_family_load: { type: integer }
            obgyn_clinician:
              type: [object, 'null']
              description: |
                A second, separate assignment. Maternal and reproductive care
                routed through whoever is free is what this pairing prevents.
              properties:
                id: { type: string, format: uuid }
                full_name: { type: string }
                current_family_load: { type: integer }

    ResearchDataset:
      type: object
      required: [id, name, deidentification_method, minimum_cell_size]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        deidentification_method: { type: string }
        k_anonymity: { type: integer }
        minimum_cell_size:
          type: integer
          description: |
            Results below this are suppressed. A count of one in a district is
            an identity.
        requires_ethics_approval: { type: boolean }
        record_count: { type: integer }

    AggregateQuery:
      type: object
      required: [measure, group_by]
      properties:
        measure:
          type: string
          enum: [count, rate, mean, median]
        metric: { type: string }
        group_by:
          type: array
          items: { type: string }
        filters:
          type: object
          additionalProperties: true
        from: { type: string, format: date }
        to: { type: string, format: date }

    ResearchQuery:
      type: object
      required: [id, dataset_id, status, submitted_at]
      properties:
        id: { type: string, format: uuid }
        dataset_id: { type: string, format: uuid }
        researcher_id: { type: string, format: uuid }
        ethics_approval_ref: { type: string }
        query: { $ref: '#/components/schemas/AggregateQuery' }
        status:
          type: string
          enum: [queued, running, complete, failed, rejected]
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        suppressed_cells:
          type: integer
          description: How many cells were withheld for falling below the threshold.
        submitted_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }

    GeoLevel:
      type: string
      enum: [ward, district, region, national, continental]

    ConditionCount:
      type: object
      required: [condition_code, condition_name, count]
      properties:
        condition_code: { type: string }
        condition_name: { type: string }
        count: { type: integer }
        rate_per_100k: { type: [number, 'null'] }
        rank: { type: integer }
        change_percent: { type: [number, 'null'] }

    TrendPoint:
      type: object
      required: [period, count]
      properties:
        period: { type: string, format: date }
        count: { type: integer }
        expected_low: { type: [number, 'null'] }
        expected_high: { type: [number, 'null'] }
        above_expected:
          type: boolean
          description: The outbreak signal — a count outside its modelled band.

    TrendSeries:
      type: object
      required: [condition_code, level, points]
      properties:
        condition_code: { type: string }
        level: { $ref: '#/components/schemas/GeoLevel' }
        area_code: { type: [string, 'null'] }
        points:
          type: array
          items: { $ref: '#/components/schemas/TrendPoint' }
        model_version: { type: string }

    InsuranceCoverage:
      type: object
      required: [patient_profile_id, schemes]
      properties:
        patient_profile_id: { type: string, format: uuid }
        schemes:
          type: array
          items:
            type: object
            properties:
              scheme_id: { type: string, format: uuid }
              scheme_name: { type: string }
              membership_number: { type: string }
              status:
                type: string
                enum: [active, lapsed, suspended, unknown]
              accepted_at_facility: { type: [boolean, 'null'] }
              covered_services:
                type: array
                items: { type: string }
              valid_until: { type: [string, 'null'], format: date }

    ClaimStatus:
      type: string
      enum: [submitted, under_review, approved, rejected, paid]

    InsuranceClaim:
      type: object
      required: [id, consultation_id, scheme_id, status, submitted_at]
      properties:
        id: { type: string, format: uuid }
        consultation_id: { type: string, format: uuid }
        scheme_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        item_codes:
          type: array
          items: { type: string }
        rejection_reason: { type: [string, 'null'] }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }

    ConsultationRating:
      type: object
      required: [id, consultation_id, score, created_at]
      properties:
        id: { type: string, format: uuid }
        consultation_id: { type: string, format: uuid }
        clinician_id: { type: string, format: uuid }
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    IncidentCategory:
      type: string
      enum: [clinical_care, misconduct, medication_error, delayed_response, data_privacy, ai_error, other]

    IncidentSeverity:
      type: string
      enum: [low, moderate, serious, catastrophic]

    IncidentStatus:
      type: string
      enum: [reported, under_investigation, action_taken, closed]

    IncidentReport:
      type: object
      required: [id, category, severity, status, reported_at]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/IncidentCategory' }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        description: { type: string }
        consultation_id: { type: [string, 'null'], format: uuid }
        clinician_id: { type: [string, 'null'], format: uuid }
        facility_id: { type: [string, 'null'], format: uuid }
        anonymous: { type: boolean }
        escalated_to_governance:
          type: boolean
          description: |
            Serious and catastrophic reports go straight to clinical and
            governance leadership rather than a customer-service queue.
        reported_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }
    PaymentMethod:
      type: string
      enum: [mobile_money, card, cash, insurance]

    PaymentProvider:
      type: string
      enum: [mpesa, tigo_pesa, airtel_money, card_gateway, manual]

    PaymentPurpose:
      type: string
      enum: [consultation_fee, pharmacy_purchase, insurance_copay, subscription, other]

    PaymentStatus:
      type: string
      enum: [pending, requires_action, processing, succeeded, failed, cancelled, refunded, partially_refunded]

    PaymentIntent:
      type: object
      required: [id, amount, currency, method, purpose, status, created_at, version]
      properties:
        id: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        provider:
          type: [string, 'null']
          description: Resolved once a mobile money provider is selected; null for cash.
        purpose: { $ref: '#/components/schemas/PaymentPurpose' }
        consultation_id: { type: [string, 'null'], format: uuid }
        dispensing_id: { type: [string, 'null'], format: uuid }
        insurance_claim_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        provider_reference:
          type: [string, 'null']
          description: |
            The provider's own transaction id. This is what a support
            conversation with the mobile money operator is conducted against
            — not this platform's internal id.
        client_action:
          type: [object, 'null']
          description: What the payer must do next — e.g. dial a USSD confirmation, or nothing for card/cash.
          additionalProperties: true
        payment_id:
          type: [string, 'null']
          format: uuid
          description: Set once the intent settles into a completed Payment record.
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }

    Payment:
      type: object
      required: [id, payment_intent_id, amount, currency, method, status, settled_at, version]
      properties:
        id: { type: string, format: uuid }
        payment_intent_id: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        provider: { type: [string, 'null'] }
        provider_reference: { type: [string, 'null'] }
        purpose: { $ref: '#/components/schemas/PaymentPurpose' }
        consultation_id: { type: [string, 'null'], format: uuid }
        payer_user_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        refunded_amount: { type: number }
        settled_at: { type: string, format: date-time }
        version: { type: integer }

    PaymentRefund:
      type: object
      required: [id, payment_id, amount, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid }
        amount: { type: number }
        reason: { type: string }
        issued_by_id: { type: [string, 'null'], format: uuid }
        provider_reference: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
