name: a_health_patient
description: A-health patient app — care that reaches you where you are.
publish_to: "none"
version: 1.0.0+2012

environment:
  sdk: ">=3.3.0 <4.0.0"

# Kept deliberately small. APK size is a stated constraint: the target device
# is a low-end Android phone, often on a metered connection, and every package
# added here is weight a patient pays for before the app has helped them once.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  connectivity_plus: ^5.0.2
  intl: ^0.20.3
  flutter_webrtc: ^1.6.2+hotfix.4
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.3
  local_auth: 3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  local_auth_platform_interface: 1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/ui.json
