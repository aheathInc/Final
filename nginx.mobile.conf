events {}

http {
  resolver 127.0.0.11 valid=30s;
  sendfile on;

  map $uri $api_upstream {
    default "";
    ~^/api/v1/(auth|users)(?:/|$) http://auth:4001;
    ~^/api/v1/patient-profiles/[^/]+/(risk-scores|vaccinations)(?:/|$) http://prevention:4024;
    ~^/api/v1/patient-profiles/[^/]+/prescriptions(?:/|$) http://consultation:4005;
    ~^/api/v1/care-threads/[^/]+/messages(?:/|$) http://messaging:4006;
    ~^/api/v1/(patient-profiles|dependants|consents)(?:/|$) http://patient:4002;
    ~^/api/v1/clinicians(?:/|$) http://doctor:4003;
    ~^/api/v1/appointments(?:/|$) http://appointment:4004;
    ~^/api/v1/(consultations|care-threads|queue|prescriptions)(?:/|$) http://consultation:4005;
    ~^/api/v1/(messages|realtime)(?:/|$) http://messaging:4006;
    ~^/api/v1/(follow-up-cycles|check-ins|adherence-logs)(?:/|$) http://followup:4007;
    ~^/api/v1/ai(?:/|$) http://ai:4009;
    ~^/api/v1/(emergency-requests|transport-units)(?:/|$) http://emergency:4010;
    ~^/api/v1/(pharmacies|dispensing)(?:/|$) http://pharmacy:4011;
    ~^/api/v1/payments(?:/|$) http://payment:4012;
    ~^/api/v1/investigation-orders(?:/|$) http://diagnostics:4013;
    ~^/api/v1/incident-reports(?:/|$) http://quality:4014;
    ~^/api/v1/families(?:/|$) http://families:4015;
    ~^/api/v1/education(?:/|$) http://education:4016;
    ~^/api/v1/network(?:/|$) http://network:4017;
    ~^/api/v1/insurance(?:/|$) http://insurance:4018;
    ~^/api/v1/research(?:/|$) http://research:4019;
    ~^/api/v1/surveillance(?:/|$) http://surveillance:4020;
    ~^/api/v1/sync(?:/|$) http://sync:4022;
    ~^/api/v1/devices(?:/|$) http://devices:4023;
    ~^/api/v1/(screening-programmes|screening-invitations)(?:/|$) http://prevention:4024;
    ~^/api/v1/facilities(?:/|$) http://facilities:4025;
  }

  server {
    listen 8080;
    server_name _;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Request-Id" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"api-edge"}';
    }

    location /api/v1/ {
      if ($request_method = OPTIONS) { return 204; }
      if ($api_upstream = "") { return 404; }
      rewrite ^/api/v1/(.*)$ /$1 break;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Idempotency-Key $http_idempotency_key;
      proxy_pass $api_upstream;
    }

    location / { return 404; }
  }
}
