components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    researchProjectKey:
      type: apiKey
      in: header
      name: Authorization
      description: ResearchKey ahr_<64 lowercase hexadecimal characters>; scoped to one approved project
  schemas:
    ProfileInput:
      type: object
      properties:
        kind:
          type: string
          enum:
          - independent
          - institutional
        display_name:
          type: string
          minLength: 2
          maxLength: 150
        institution:
          type:
          - string
          - 'null'
          maxLength: 200
        credential_reference:
          type: string
          minLength: 2
          maxLength: 150
        base_version: &id005
          type: integer
          minimum: 1
      required:
      - kind
      - display_name
      - credential_reference
      additionalProperties: false
    EvidenceInput:
      type: object
      properties:
        study_id: *id001
        source_id: *id001
        kind:
          type: string
          enum:
          - identity
          - protocol
          - ethics
          - controller
          - agreement
        content_base64:
          type: string
          maxLength: 699052
          description: Canonical base64 PDF, at most 512 KiB decoded. ClamAV scanning is mandatory.
      required:
      - kind
      - content_base64
      additionalProperties: false
    StudyInput:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        purpose:
          type: string
          minLength: 20
          maxLength: 3000
        dataset_id: *id001
        ethics_reference:
          type: string
          minLength: 3
          maxLength: 150
        ethics_expires_at: &id003
          type: string
          format: date-time
        controller_reference:
          type: string
          minLength: 3
          maxLength: 150
        expires_at: *id003
        allow_export: &id004
          type: boolean
        allow_ecrf: *id004
        allow_row_level:
          type: boolean
          default: false
          description: Separate person-level OMOP/eCRF scope; independent protocol/controller approval required.
      required:
      - title
      - purpose
      - dataset_id
      - ethics_reference
      - ethics_expires_at
      - controller_reference
      - expires_at
      - allow_export
      - allow_ecrf
      additionalProperties: false
    VersionInput:
      type: object
      properties:
        base_version: *id005
      required:
      - base_version
      additionalProperties: false
    CollectionInput:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          minLength: 10
          maxLength: 1500
        domains:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - condition
            - measurement
            - drug
            - procedure
            - observation
            - imaging
        minimum_cell_size:
          type: integer
          minimum: 10
          maximum: 100
        synthetic_only: *id004
      required:
      - name
      - description
      - domains
      - minimum_cell_size
      - synthetic_only
      additionalProperties: false
    SourceInput:
      type: object
      properties:
        dataset_id: *id001
        facility_id: *id001
        steward_id: *id001
        agreement_reference:
          type: string
          minLength: 3
          maxLength: 150
        expires_at: *id003
      required:
      - dataset_id
      - facility_id
      - steward_id
      - agreement_reference
      - expires_at
      additionalProperties: false
    MappingInput:
      type: object
      properties:
        system:
          type: string
          enum:
          - ICD10
          - ICD11
          - LOINC
          - RxNorm
          - SNOMED
          - CPT
          - LOCAL
        source_code:
          type: string
          minLength: 1
          maxLength: 40
        domain:
          type: string
          enum:
          - condition
          - measurement
          - drug
          - procedure
          - observation
          - imaging
        concept_id:
          type: integer
          minimum: 1
          maximum: 2147483647
        vocabulary_version:
          type: string
          minLength: 1
          maxLength: 80
        label:
          type: string
          minLength: 1
          maxLength: 160
        standard_concept: *id004
        mapping_checked: *id004
      required:
      - system
      - source_code
      - domain
      - concept_id
      - vocabulary_version
      - label
      - standard_concept
      - mapping_checked
      additionalProperties: false
    QueryInput:
      type: object
      properties:
        study_id: *id001
        filters: &id006
          type: object
          properties:
            age_band:
              type: string
              minLength: 1
              maxLength: 40
            sex:
              type: string
              minLength: 1
              maxLength: 40
            region:
              type: string
              minLength: 1
              maxLength: 40
            period:
              type: string
              minLength: 1
              maxLength: 40
            domain:
              type: string
              minLength: 1
              maxLength: 40
            code:
              type: string
              minLength: 1
              maxLength: 40
          required: []
          additionalProperties: false
      required:
      - study_id
      additionalProperties: false
    ExportInput:
      type: object
      properties:
        study_id: *id001
        format:
          type: string
          enum:
          - csv
          - xlsx
          - json
          - xml
        filters: *id006
      required:
      - study_id
      - format
      additionalProperties: false
    FormInput:
      type: object
      properties:
        study_id: *id001
        title:
          type: string
          minLength: 3
          maxLength: 160
        fields:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                minLength: 2
                maxLength: 40
              label:
                type: string
                minLength: 3
                maxLength: 100
              type:
                type: string
                enum:
                - number
                - choice
                - boolean
              required: *id004
              min:
                type: number
                minimum: -10000
              max:
                type: number
                maximum: 10000
              choices:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 50
                minItems: 2
                maxItems: 20
            required:
            - key
            - label
            - type
            - required
            additionalProperties: false
          minItems: 1
          maxItems: 20
      required:
      - study_id
      - title
      - fields
      additionalProperties: false
    ResponseInput:
      type: object
      properties:
        form_id: *id001
        subject_code:
          type: string
          pattern: ^[A-Z0-9_-]{3,80}$
        consent_reference:
          type: string
          minLength: 3
          maxLength: 120
        consent_confirmed: *id004
        answers:
          type: object
          additionalProperties:
            type:
            - number
            - string
            - boolean
      required:
      - form_id
      - subject_code
      - consent_reference
      - consent_confirmed
      - answers
      additionalProperties: false
    KeyInput:
      type: object
      properties:
        study_id: *id001
      required:
      - study_id
      additionalProperties: false
    ReleaseInput:
      type: object
      properties:
        dataset_id: *id001
      required:
      - dataset_id
      additionalProperties: false
    EmptyInput:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 200
            message:
              type: string
              minLength: 1
              maxLength: 1000
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Envelope:
      type: object
      properties:
        data: {}
      required:
      - data
      additionalProperties: false
    FileEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            file_name:
              type: string
              minLength: 1
              maxLength: 200
            content_type:
              type: string
              minLength: 1
              maxLength: 200
            content_base64:
              type: string
            sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
          required:
          - file_name
          - content_type
          - content_base64
          - sha256
          additionalProperties: false
      required:
      - data
      additionalProperties: false
    IngestInput:
      type: object
      properties:
        source_id: *id001
        synthetic: *id004
        records:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: string
                minLength: 1
                maxLength: 120
              subject_key:
                type: string
                minLength: 1
                maxLength: 120
              age:
                type: integer
                minimum: 0
                maximum: 125
              sex:
                type: string
                enum:
                - female
                - male
                - other
                - unknown
              region_code:
                type: string
                pattern: ^TZ-(0[1-9]|[12][0-9]|3[01])$
              event_date:
                type: string
                format: date
              domain:
                type: string
                enum:
                - condition
                - measurement
                - drug
                - procedure
                - observation
                - imaging
              code_system:
                type: string
                enum:
                - ICD10
                - ICD11
                - LOINC
                - RxNorm
                - SNOMED
                - CPT
                - LOCAL
              code:
                type: string
                minLength: 1
                maxLength: 40
              value:
                type:
                - number
                - 'null'
              unit:
                type:
                - string
                - 'null'
                maxLength: 24
              dose:
                type:
                - number
                - 'null'
              duration_days:
                type:
                - number
                - 'null'
              name:
                description: Discarded in memory, never retained. Omit at source.
                deprecated: true
              phone:
                description: Discarded in memory, never retained. Omit at source.
                deprecated: true
              national_id:
                description: Discarded in memory, never retained. Omit at source.
                deprecated: true
              address:
                description: Discarded in memory, never retained. Omit at source.
                deprecated: true
              patient_id:
                description: Discarded in memory, never retained. Omit at source.
                deprecated: true
            required:
            - event_id
            - subject_key
            - age
            - sex
            - region_code
            - event_date
            - domain
            - code_system
            - code
            additionalProperties: false
          minItems: 1
          maxItems: 500
      required:
      - source_id
      - synthetic
      - records
      additionalProperties: false
    ProfileReview:
      type: object
      properties:
        base_version: *id005
        decision:
          type: string
          enum:
          - verified
          - rejected
          - suspended
        identity_checked: *id004
        note:
          type: string
          minLength: 5
          maxLength: 500
      required:
      - base_version
      - decision
      - note
      additionalProperties: false
    StudyReview:
      type: object
      properties:
        base_version: *id005
        decision:
          type: string
          enum:
          - approved
          - rejected
          - revoked
        ethics_checked: *id004
        controller_checked: *id004
        scope_checked: *id004
        note:
          type: string
          minLength: 5
          maxLength: 500
        row_level_checked: &id007
          type: boolean
      required:
      - base_version
      - decision
      - note
      additionalProperties: false
    SourceReview:
      type: object
      properties:
        base_version: *id005
        decision:
          type: string
          enum:
          - approved
          - revoked
        agreement_checked: *id004
      required:
      - base_version
      - decision
      additionalProperties: false
    ReleaseReview:
      type: object
      properties:
        base_version: *id005
        decision:
          type: string
          enum:
          - published
          - rejected
          - revoked
        disclosure_checked: *id004
        provenance_checked: *id004
        note:
          type: string
          minLength: 5
          maxLength: 500
      required:
      - base_version
      - decision
      - note
      additionalProperties: false
    ExportReview:
      type: object
      properties:
        base_version: *id005
        decision:
          type: string
          enum:
          - approved
          - rejected
        output_checked: *id004
      required:
      - base_version
      - decision
      additionalProperties: false
    FormReview:
      type: object
      properties:
        base_version: *id005
        decision:
          type: string
          enum:
          - published
          - rejected
        protocol_checked: *id004
      required:
      - base_version
      - decision
      additionalProperties: false
    OmopBundle:
      type: object
      additionalProperties: false
      properties:
        cdm_version:
          type: string
          enum:
          - '5.4'
        tables:
          type: object
          description: Structured OMOP source rows. Only permitted tables; no raw notes, identifying attributes,
            precise DOB, DDL or SQL. Record IDs are source-assigned strings or integers; the server pseudonymizes
            them. Required-value and referential checks run at materialization.
          additionalProperties: false
          properties:
            person:
              type: array
              maxItems: 5000
              items:
                type: object
                additionalProperties: false
                properties:
                  person_id:
                    oneOf:
                    - type: integer
                      minimum: 0
                    - type: string
                      pattern: ^[A-Za-z0-9_.:-]{1,100}$
                    - type: 'null'
                  gender_concept_id:
                    type:
                    - integer
                    - 'null'
                  year_of_birth:
                    type:
                    - integer
                    - 'null'
                  month_of_birth:
