openapi: 3.1.0
info:
  title: A-Health Governed Research Portal
  version: 2.0.0-rc2
  description: Free, project-authorized research portal with separately provisioned OMOP CDM 5.4 warehouse, encrypted
    eCRF snapshots, independent disclosure review and controlled exports. Row-level scopes require explicit approval.
    No automatic EHR ingestion or anonymization certification is claimed.
servers:
- url: /
  description: Direct Research service; add a reverse-proxy prefix only when configured.
tags:
- name: Research portal
  description: Free, governed access to approved research outputs
paths:
  /research/portal/bootstrap:
    get:
      operationId: researchPortalGetBootstrap
      tags:
      - Research portal
      summary: Read role-scoped research workspace
      security:
      - bearerAuth: []
      description: Free service. Live account, role, identity and project/source authorization are enforced. Approval
        actions require base_version and explicit applicable review checks. Metadata fields use the endpoint-defined
        names; row metadata preserves the existing domain casing.
      responses:
        '200':
          description: Authorized response; data envelope. Downloads contain base64 file bytes for the existing
            BFF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied, revoked, expired or role not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, duplicate or immutable mapping conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: HTTP request body limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
