    WarehouseIngest:
      type: object
      additionalProperties: false
      properties:
        source_id: *id002
        request_key:
          type: string
          minLength: 8
          maxLength: 120
        synthetic: *id007
        bundle:
          $ref: '#/components/schemas/OmopBundle'
      required:
      - source_id
      - request_key
      - synthetic
      - bundle
    WarehouseBuild:
      type: object
      additionalProperties: false
      properties:
        source_id: *id002
        date_policy:
          type: string
          enum:
          - restricted_source_dates
          - shifted_dates
      required:
      - source_id
      - date_policy
    VersionAction:
      type: object
      additionalProperties: false
      properties:
        base_version: &id008
          type: integer
          minimum: 1
      required:
      - base_version
    WarehouseReview:
      type: object
      additionalProperties: false
      properties:
        base_version: *id008
        decision:
          type: string
          enum:
          - published
          - rejected
          - revoked
        mapping_checked: *id007
        date_policy_checked: *id007
        disclosure_checked: *id007
        note: &id009
          type: string
          minLength: 5
          maxLength: 500
      required:
      - base_version
      - decision
      - note
    ResponseRegister:
      type: object
      additionalProperties: false
      properties:
        form_id: *id002
      required:
      - form_id
    ResponseWithdrawal:
      type: object
      additionalProperties: false
      properties:
        base_version: *id008
        reason:
          type: string
          enum:
          - participant_withdrew
          - consent_invalid
          - record_error
      required:
      - base_version
      - reason
    ResponsePrepare:
      type: object
      additionalProperties: false
      properties:
        form_id: *id002
        bins:
          type: object
          description: Protocol-fixed numeric-bin boundaries. First approved-form analysis plan cannot change. Default
            is five equal bins across each field range.
          additionalProperties:
            type: array
            minItems: 3
            maxItems: 11
            items:
              type: number
      required:
      - form_id
    ResponseReview:
      type: object
      additionalProperties: false
      properties:
        base_version: *id008
        decision:
          type: string
          enum:
          - published
          - rejected
          - revoked
        protocol_checked: *id007
        disclosure_checked: *id007
        note: *id009
      required:
      - base_version
      - decision
      - note
    ControlledOutputRequest:
      type: object
      additionalProperties: false
      properties:
        study_id: *id002
        kind:
          type: string
          enum:
          - ecrf_aggregate
          - ecrf_rows
          - omop
        snapshot_id: *id002
        build_id: *id002
        format:
          type: string
          enum:
          - csv
          - xlsx
          - json
          - xml
          - omop_zip
      required:
      - study_id
      - kind
      - format
    ControlledOutputReview:
      type: object
      additionalProperties: false
      properties:
        base_version: *id008
        decision:
          type: string
          enum:
          - approved
          - rejected
          - revoked
        output_checked: *id007
        row_level_checked: *id007
        note: *id009
      required:
      - base_version
      - decision
      - note
    ReviewedResponseCell:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
