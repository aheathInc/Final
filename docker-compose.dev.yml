# Generated by setup-docker-compose.sh — regenerate rather than hand-edit
# service blocks; the port map and any per-service env additions live in
# that script, not here, so the two can never quietly drift apart.
name: a-health-dev

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ahealth
      POSTGRES_PASSWORD: ahealth
      POSTGRES_DB: ahealth_dev
    ports:
      - "5432:5432"
    volumes:
      - ahealth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahealth -d ahealth_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["node", "--import", "tsx", "src/index.ts"]
    working_dir: /repo/services/auth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_URL: postgresql://ahealth:ahealth@postgres:5432/ahealth_dev?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32-characters-minimum}
      JWT_ISSUER: a-health
      JWT_AUDIENCE: a-health-api
    ports:
      - "4001:4001"
    volumes:
      - ./services:/repo/services
      - ./packages:/repo/packages

